          cp releaseqa-build-status.txt releaseqa-badging.txt releaseqa-certificate.txt releaseqa-target-dex-strings.txt releaseqa-lesson-status.txt releaseqa-lesson-instrumentation.txt releaseqa-lesson-logcat.txt qa-artifact/
          cp -R qa-releaseqa-screens qa-artifact/releaseqa-screens
