      - name: Build signed release APK and AAB when original signing secrets are present
        id: signed_release
        if: env.RELEASEQA_MODE == 'full'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          STATUS=release-signing-status.txt
          if [ -n "${ENVSTUDIES_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ENVSTUDIES_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_ALIAS:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/environmental-studies-release.keystore"
            printf '%s' "$ENVSTUDIES_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            ENVSTUDIES_KEYSTORE_PATH="$KEYSTORE" gradle --no-daemon :app:assembleRelease :app:bundleRelease -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
            SIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
            SIGNED_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
            test -f "$SIGNED_APK"
            test -f "$SIGNED_AAB"
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" | tee release-certificate.txt
            grep -q 'Signer #1 certificate SHA-256 digest:' release-certificate.txt

            rm -rf signed-release-artifacts
            mkdir -p signed-release-artifacts
            cp "$SIGNED_APK" signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.apk
            cp "$SIGNED_AAB" signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.aab
            cp release-certificate.txt signed-release-artifacts/release-certificate.txt
            sha256sum               signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.apk               signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.aab               | tee signed-release-artifacts/SHA256SUMS.txt

            echo "signed_release_available=true" | tee "$STATUS"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed_release_available=false" | tee "$STATUS"
            echo "SIGNED RELEASE BLOCKED: ORIGINAL SIGNING CREDENTIALS REQUIRED" | tee -a "$STATUS"
            echo "Original production signing secrets are not configured on this runner; no replacement key was generated." | tee -a "$STATUS"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload signed production APK before emulator
        if: steps.signed_release.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-SIGNED-PRODUCTION-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.apk
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/release-certificate.txt
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload signed production AAB before emulator
        if: steps.signed_release.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-SIGNED-PRODUCTION-AAB-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/Environmental-Studies-v2.4.5-RELEASE.aab
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/release-certificate.txt
            native-build/Environmental-Studies-v2.0.0-native/signed-release-artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Install PDF QA utilities
        if: env.RELEASEQA_MODE != 'dex_audit'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          command -v pdffonts
          command -v pdfinfo

      - name: Enable KVM for Android emulator
        if: env.RELEASEQA_MODE != 'dex_audit'
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Verify complete releaseQa missing-class coverage
        if: env.RELEASEQA_MODE == 'instrumentation'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          test -f releaseqa-missing-runtime-classes.txt
          test -f app/proguard-releaseqa-target.pro
          test -f app/proguard-releaseqa-androidtest.pro
          test -f ../../ci/v245_releaseqa_runtime_keep.pro

          python - <<'PYCOVER'
          from pathlib import Path
          legacy=[x.strip() for x in Path("releaseqa-missing-runtime-classes.txt").read_text().splitlines() if x.strip()]
          genuine=[x.strip() for x in Path("releaseqa-genuine-missing-runtime-classes.txt").read_text().splitlines() if x.strip()]
          target=Path("app/proguard-releaseqa-target.pro").read_text()
          test_rules=Path("app/proguard-releaseqa-androidtest.pro").read_text()
          baseline=Path("../../ci/v245_releaseqa_runtime_keep.pro").read_text()
          uncovered=[]
          for cls in legacy:
              rule=f"-keep class {cls} {{ *; }}"
              if rule not in target or rule not in test_rules or rule not in baseline:
                  uncovered.append(cls)
          Path("releaseqa-uncovered-runtime-classes.txt").write_text(
              "\n".join(uncovered)+("\n" if uncovered else ""), encoding="utf-8"
          )
          if uncovered:
              print("STOP: broad Run #199 compatibility classes are not fully represented in the QA-only keep set:")
              print("\n".join(uncovered))
              raise SystemExit(23)
          if genuine:
              print("STOP: test DEX references namespace classes defined by neither test DEX nor app DEX:")
              print("\n".join(genuine))
              raise SystemExit(24)

          summary={}
          for line in Path("releaseqa-runtime-keep-match-summary.txt").read_text().splitlines():
              if "=" in line:
                  k,v=line.split("=",1)
                  summary[k]=int(v)
          assert summary["keep_rules_total"] == 1368, summary
          assert summary["preexisting_lazy_keep_rules"] == 3, summary
          assert summary["run199_keep_rules_total"] == 1365, summary
          assert (
              summary["run199_keep_rules_matching_app_defined_classes"]
              + summary["run199_keep_rules_matching_nothing_in_app_dex"]
              == summary["run199_keep_rules_total"]
          ), summary
          assert (
              summary["keep_rules_matching_app_defined_classes"]
              + summary["keep_rules_matching_nothing_in_app_dex"]
              == summary["keep_rules_total"]
          ), summary
          print("releaseqa_genuine_missing_class_coverage=PASS genuine_missing=0")
          print(f"releaseqa_broad_descriptor_difference={len(legacy)}")
          print(f"releaseqa_run199_keep_rules_total={summary['run199_keep_rules_total']}")
          print(f"releaseqa_run199_keep_rules_matching_app_defined_classes={summary['run199_keep_rules_matching_app_defined_classes']}")
          print(f"releaseqa_run199_keep_rules_matching_nothing_in_app_dex={summary['run199_keep_rules_matching_nothing_in_app_dex']}")
          print(f"releaseqa_total_keep_rules_including_3_preexisting_lazy={summary['keep_rules_total']}")
          PYCOVER

      - name: Prepare AndroidSVG emulator QA script
        if: env.RELEASEQA_MODE != 'dex_audit'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v245-androidsvg-emulator.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/native-build/Environmental-Studies-v2.0.0-native"

          # releaseQa is a QA-only derivative of release: production
          # applicationId, R8/minification and resource shrinking retained,
          # but signed with the standard Android debug key and debuggable so
          # instrumentation evidence can be extracted. It is never a
          # production/store artefact.
          gradle --no-daemon :app:assembleReleaseQa :app:assembleReleaseQaAndroidTest \
            -PPRIVACY_POLICY_URL="$PRIVACY_URL" \
            --stacktrace

          PACKAGE=edu.gascnagercoil.environmentalsciences
          APP_APK="$(find app/build/outputs/apk/releaseQa -maxdepth 1 -type f -name '*.apk' | head -n1)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/releaseQa -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$APP_APK"
          test -f "$TEST_APK"
          test -f app/build/outputs/mapping/releaseQa/mapping.txt

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APP_APK" | tee releaseqa-badging.txt
          "$APKSIGNER" verify --print-certs "$APP_APK" | tee releaseqa-certificate.txt
          grep -q "package: name='edu.gascnagercoil.environmentalsciences'" releaseqa-badging.txt
          grep -Fq "QA-ONLY, DEBUG-SIGNED, NOT FOR DISTRIBUTION" releaseqa-badging.txt
          grep -q 'CN=Android Debug' releaseqa-certificate.txt

          # Fail before instrumentation if the target APK still lacks the
          # Kotlin lazy façade that AndroidX Test resolves from the app classloader.
          unzip -p "$APP_APK" 'classes*.dex' | strings > releaseqa-target-dex-strings.txt
          grep -Fq 'Lkotlin/LazyKt;' releaseqa-target-dex-strings.txt
          grep -Fq 'Lkotlin/LazyKt__LazyJVMKt;' releaseqa-target-dex-strings.txt
          grep -Fq 'Lkotlin/LazyKt__LazyKt;' releaseqa-target-dex-strings.txt
          {
            echo "variant=releaseQa"
            echo "label=QA-ONLY, DEBUG-SIGNED, NOT FOR DISTRIBUTION"
            echo "applicationId=edu.gascnagercoil.environmentalsciences"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "target_kotlin_lazy_classes=PASS"
            echo "signing=ANDROID_DEBUG_KEY"
            echo "distribution=PROHIBITED"
          } | tee releaseqa-build-status.txt

          adb install -r "$APP_APK"
          adb install -r -t "$TEST_APK"

          INSTRUMENTATION="$(adb shell pm list instrumentation | tr -d '\r' | grep "(target=$PACKAGE)" | sed -n 's/^instrumentation:\([^ ]*\) .*/\1/p' | head -n1)"
          test -n "$INSTRUMENTATION"
          TEST_PACKAGE="${INSTRUMENTATION%%/*}"
          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.SvgAndroidSvgScreenshotTest \
            "$INSTRUMENTATION" | tee androidsvg-instrumentation.txt
          grep -Eq '^OK \([0-9]+ test' androidsvg-instrumentation.txt

          TEST_PACKAGE="${INSTRUMENTATION%%/*}"

          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.PdfExporterRenderTest \
            "$INSTRUMENTATION" | tee pdf-export-instrumentation.txt
          grep -Eq '^OK \([0-9]+ test' pdf-export-instrumentation.txt

          adb logcat -c || true
          set +e
          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.ReleaseQaLessonEvidenceTest \
            "$INSTRUMENTATION" | tee releaseqa-lesson-instrumentation.txt
          LESSON_RC=${PIPESTATUS[0]}
          set -e
          adb logcat -d -v threadtime > releaseqa-lesson-logcat.txt || true
          if [ "$LESSON_RC" -ne 0 ] || ! grep -Eq '^OK \([0-9]+ test' releaseqa-lesson-instrumentation.txt; then
            echo "ReleaseQaLessonEvidenceTest failed; diagnostic logcat follows." >&2
            tail -n 250 releaseqa-lesson-logcat.txt >&2 || true
            exit 12
          fi
          rm -rf qa-releaseqa-screens
          mkdir -p qa-releaseqa-screens
          for NAME in u2l1-en-fig005.png u2l5-en-fig013.png u4l6-en-fig038.png u5l1-en-fig046.png; do
            adb exec-out run-as "$PACKAGE" cat "files/releaseqa-evidence/$NAME" > "qa-releaseqa-screens/$NAME"
            test -s "qa-releaseqa-screens/$NAME"
          done
          adb exec-out run-as "$PACKAGE" cat files/releaseqa-evidence/status.txt > releaseqa-lesson-status.txt
          grep -Fx 'variant=releaseQa' releaseqa-lesson-status.txt
          grep -Fx 'label=QA-ONLY, DEBUG-SIGNED, NOT FOR DISTRIBUTION' releaseqa-lesson-status.txt
          grep -Fx 'u2l1_fig005_visible=PASS' releaseqa-lesson-status.txt
          grep -Fx 'u2l5_fig013_visible=PASS' releaseqa-lesson-status.txt
          grep -Fx 'u4l6_fig038_visible=PASS' releaseqa-lesson-status.txt
          grep -Fx 'u5l1_fig046_visible=PASS' releaseqa-lesson-status.txt

          # Attempt an engine-present bilingual TTS check, but do not block
          # visual/PDF evidence extraction if the CI emulator cannot provide a
          # usable TTS engine. Step 62 remains the authoritative TTS gate.
          ESPEAK_APK="$RUNNER_TEMP/com.reecedunn.espeak_22.apk"
          TTS_ENGINE_READY=false
          if curl -fL --retry 3 --retry-delay 2 \
               https://f-droid.org/repo/com.reecedunn.espeak_22.apk \
               -o "$ESPEAK_APK" \
             && test -s "$ESPEAK_APK" \
             && adb install -r "$ESPEAK_APK"; then
            adb shell monkey -p com.reecedunn.espeak -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
            sleep 4
            adb shell settings put secure tts_default_synth com.reecedunn.espeak || true
            if adb shell pm list packages | tr -d '\r' | grep -Fx 'package:com.reecedunn.espeak' \
               && adb shell settings get secure tts_default_synth | tr -d '\r' | grep -Fx 'com.reecedunn.espeak'; then
              TTS_ENGINE_READY=true
            fi
          fi
          adb shell pm list packages | tr -d '\r' | grep -Ei 'tts|speech|espeak' | tee tts-engine-packages.txt || true

          if [ "$TTS_ENGINE_READY" = "true" ]; then
            set +e
            adb shell am instrument -w \
              -e class edu.gascnagercoil.environmentalsciences.qa.TtsVisibilitySmokeTest \
              "$INSTRUMENTATION" | tee tts-instrumentation.txt
            TTS_RC=${PIPESTATUS[0]}
            set -e
            if [ "$TTS_RC" -eq 0 ]; then
              adb exec-out run-as "$PACKAGE" cat files/tts-qa/status.txt > tts-smoke-status.txt || true
            fi
            if [ ! -s tts-smoke-status.txt ]; then
              {
                echo "tts_environment=ENGINE_PRESENT_TEST_FAILED"
                echo "tts_gap=NOT_A_PASS"
                echo "physical_device_tts_required=true"
              } > tts-smoke-status.txt
            fi
          else
            {
              echo "tts_environment=EMULATOR_ENGINE_UNAVAILABLE"
              echo "tts_gap=NOT_A_PASS"
              echo "physical_device_tts_required=true"
            } > tts-smoke-status.txt
            echo "TTS GAP: CI emulator has no usable TTS engine; physical-device verification is required." | tee tts-instrumentation.txt
          fi

          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.Fig038LessonScreenshotTest \
            "$INSTRUMENTATION" | tee fig038-screen-instrumentation.txt
          grep -Eq '^OK \([0-9]+ test' fig038-screen-instrumentation.txt
          adb exec-out run-as "$PACKAGE" cat files/fig038-screen/u4l6-fig038.png > fig038-u4l6-screen.png
          test -s fig038-u4l6-screen.png
          python - <<'PYFIG'
          from pathlib import Path
          p=Path("fig038-u4l6-screen.png")
          assert p.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          assert p.stat().st_size > 10000
          PYFIG
          echo "fig038_u4l6_lesson_screen=PASS" | tee fig038-screen-status.txt

          rm -rf qa-pdf-export
          mkdir -p qa-pdf-export
          PDF_PACKAGE=""
          for CANDIDATE in "$PACKAGE" "$TEST_PACKAGE"; do
            [ -n "$CANDIDATE" ] || continue
            if adb shell run-as "$CANDIDATE" test -d files/pdf-qa; then
              PDF_PACKAGE="$CANDIDATE"
              break
            fi
          done
          test -n "$PDF_PACKAGE"
          for NAME in english-figure.pdf tamil-svg.pdf; do
            adb exec-out run-as "$PDF_PACKAGE" cat "files/pdf-qa/$NAME" > "qa-pdf-export/$NAME"
            test -s "qa-pdf-export/$NAME"
          done
          pdffonts qa-pdf-export/tamil-svg.pdf | tee qa-pdf-export/tamil-fonts.txt
          grep -Eqi 'Noto.*Tamil' qa-pdf-export/tamil-fonts.txt
          pdfinfo qa-pdf-export/english-figure.pdf | tee qa-pdf-export/english-pdfinfo.txt
          pdfinfo qa-pdf-export/tamil-svg.pdf | tee qa-pdf-export/tamil-pdfinfo.txt
          echo "pdf_export_english_figure=PASS" | tee pdf-export-status.txt
          echo "pdf_export_tamil_svg=PASS" | tee -a pdf-export-status.txt
          echo "pdf_export_tamil_font=Noto Sans Tamil" | tee -a pdf-export-status.txt

          rm -rf qa-svg-androidsvg
          mkdir -p qa-svg-androidsvg

          # SvgAndroidSvgScreenshotTest writes the 46 PNG renders and its
          # result manifest to the target app's external files directory.
          # This path is readable by adb pull on the API-35 emulator and does
          # not depend on run-as/private app data access.
          SDK_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          REMOTE_RENDER_DIR="/sdcard/Android/data/$PACKAGE/files/svg-androidsvg"
          {
            echo "androidsvg_target_package=$PACKAGE"
            echo "androidsvg_emulator_api=$SDK_LEVEL"
            echo "androidsvg_external_path=$REMOTE_RENDER_DIR"
          } | tee androidsvg-render-package.txt
          test "$SDK_LEVEL" = "35"

          adb shell test -d "$REMOTE_RENDER_DIR"
          adb shell test -r "$REMOTE_RENDER_DIR/result-manifest.txt"
          adb shell ls -la "$REMOTE_RENDER_DIR" | tee androidsvg-external-ls.txt
          adb pull "$REMOTE_RENDER_DIR/." qa-svg-androidsvg/

          test -s qa-svg-androidsvg/result-manifest.txt
          grep -Fx 'api=35' qa-svg-androidsvg/result-manifest.txt
          grep -Fx 'package=edu.gascnagercoil.environmentalsciences' qa-svg-androidsvg/result-manifest.txt
          grep -Fx 'expected=46' qa-svg-androidsvg/result-manifest.txt
          grep -Fx 'rendered=46' qa-svg-androidsvg/result-manifest.txt
          grep -Fx 'result=46/46' qa-svg-androidsvg/result-manifest.txt

          python - <<'PYPNG'
          from pathlib import Path
          files=sorted(Path("qa-svg-androidsvg").glob("*.png"))
          assert len(files) == 46, len(files)
          sig=b"\x89PNG\r\n\x1a\n"
          bad=[p.name for p in files if not p.read_bytes().startswith(sig)]
          assert not bad, bad
          PYPNG

          SOURCE_EXPECTED="$(find app/src/main/res/raw -maxdepth 1 -type f -name '*_ta.svg' | wc -l)"
          EXPECTED=46
          ACTUAL="$(find qa-svg-androidsvg -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$SOURCE_EXPECTED" -eq "$EXPECTED"
          test "$ACTUAL" -eq "$EXPECTED"

          echo "androidsvg_tamil_svg_expected=$EXPECTED" | tee androidsvg-emulator-status.txt
          echo "androidsvg_tamil_svg_rendered=$ACTUAL" | tee -a androidsvg-emulator-status.txt
          echo "androidsvg_tamil_svg_result=$ACTUAL/$EXPECTED" | tee -a androidsvg-emulator-status.txt
          echo "androidsvg_emulator_api=$SDK_LEVEL" | tee -a androidsvg-emulator-status.txt
          echo "androidsvg_external_pull=PASS" | tee -a androidsvg-emulator-status.txt
          echo "androidsvg_emulator_render=PASS" | tee -a androidsvg-emulator-status.txt

          if [ -n "${ENVSTUDIES_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ENVSTUDIES_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ENVSTUDIES_KEY_ALIAS:-}" ] && \
             [ -n "${ENVSTUDIES_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/environmental-studies-release.keystore"
            printf '%s' "$ENVSTUDIES_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            ENVSTUDIES_KEYSTORE_PATH="$KEYSTORE" gradle --no-daemon :app:generateBaselineProfile \
              -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
            echo "baseline_profile_device_generation=PASS" >> baseline-profile-status.txt
          else
            echo "baseline_profile_device_generation=SKIPPED_NO_PRODUCTION_SIGNING_SECRETS" >> baseline-profile-status.txt
          fi
          BASH
          chmod 700 "$RUNNER_TEMP/v245-androidsvg-emulator.sh"

      - name: Render every Tamil SVG through AndroidSVG on emulator
        if: env.RELEASEQA_MODE != 'dex_audit'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash "$RUNNER_TEMP/v245-androidsvg-emulator.sh"

      - name: Upload releaseQa DEX audit evidence
        if: always() && env.RELEASEQA_MODE != 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-releaseQa-DEX-AUDIT-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-app-dex/
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-test-dex/
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-app-namespace-descriptors.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-test-namespace-descriptors.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-missing-runtime-descriptors.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-missing-runtime-classes.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-missing-runtime-keep-rules.pro
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-dex-audit-summary.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-genuine-missing-runtime-classes.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-runtime-keep-match-summary.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-keep-rules-matching-app-defs.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-keep-rules-unmatched-app-defs.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-run199-keep-rules-matching-app-defs.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-run199-keep-rules-unmatched-app-defs.txt
            native-build/Environmental-Studies-v2.0.0-native/release-privacy-dex-status.txt
            native-build/Environmental-Studies-v2.0.0-native/release-privacy-dex-urls.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-apk-sha256.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-app-dex-sha256.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-test-dex-sha256.txt
            native-build/Environmental-Studies-v2.0.0-native/app/proguard-releaseqa-target.pro
            native-build/Environmental-Studies-v2.0.0-native/app/proguard-releaseqa-androidtest.pro
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-uncovered-runtime-classes.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-instrumentation.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-external-ls.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-lesson-instrumentation.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-lesson-logcat.txt
          if-no-files-found: warn

      - name: Verify engine-present bilingual TTS result
        if: env.RELEASEQA_MODE == 'full'
        id: tts_engine
        continue-on-error: true
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          test -s tts-smoke-status.txt
          grep -Fx 'tts_environment=ENGINE_PRESENT' tts-smoke-status.txt
          grep -Fx 'tts_init=PASS' tts-smoke-status.txt
          grep -Fx 'english_tts=PASS' tts-smoke-status.txt
          grep -Fx 'tamil_voice_available=true' tts-smoke-status.txt
          grep -Fx 'tamil_tts=PASS' tts-smoke-status.txt

      - name: Upload releaseQa device evidence
        if: env.RELEASEQA_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-releaseQa-DEVICE-EVIDENCE
          path: |
            native-build/Environmental-Studies-v2.0.0-native/app/build/outputs/apk/releaseQa/
            native-build/Environmental-Studies-v2.0.0-native/qa-releaseqa-screens/
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-build-status.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-badging.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-certificate.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-target-dex-strings.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-lesson-status.txt
            native-build/Environmental-Studies-v2.0.0-native/releaseqa-lesson-instrumentation.txt
            native-build/Environmental-Studies-v2.0.0-native/fig038-u4l6-screen.png
            native-build/Environmental-Studies-v2.0.0-native/qa-pdf-export/
            native-build/Environmental-Studies-v2.0.0-native/pdf-export-status.txt
            native-build/Environmental-Studies-v2.0.0-native/tts-smoke-status.txt
            native-build/Environmental-Studies-v2.0.0-native/tts-instrumentation.txt
            native-build/Environmental-Studies-v2.0.0-native/tts-engine-packages.txt
          if-no-files-found: error

      - name: Upload AndroidSVG Tamil render evidence
        if: env.RELEASEQA_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-Tamil-SVG-Renders
          path: |
            native-build/Environmental-Studies-v2.0.0-native/qa-svg-androidsvg/
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-emulator-status.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-render-package.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-instrumentation.txt
          if-no-files-found: error

      - name: Inspect v2.4.5 package identity and offline contract
        if: env.RELEASEQA_MODE == 'full'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$DEBUG_APK" | tee qa-badging-debug.txt
          "$AAPT" dump permissions "$DEBUG_APK" | tee qa-permissions-debug.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee qa-badging-release.txt
          "$AAPT" dump permissions "$RELEASE_APK" | tee qa-permissions-release.txt
          "$AAPT" dump resources "$DEBUG_APK" | tee qa-resources-debug.txt
          "$AAPT" dump resources "$RELEASE_APK" | tee qa-resources-release.txt
          "$AAPT" dump xmltree "$RELEASE_APK" AndroidManifest.xml | tee qa-manifest-xmltree-release.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging-debug.txt
          grep -q "versionCode='20405'" qa-badging-debug.txt
          grep -q "versionName='2.4.5-debug'" qa-badging-debug.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences'" qa-badging-release.txt
          grep -q "versionCode='20405'" qa-badging-release.txt
          grep -q "versionName='2.4.5'" qa-badging-release.txt
          ! grep -q 'application-debuggable' qa-badging-release.txt

          ! grep -q 'android.permission.INTERNET' qa-permissions-release.txt
          ! grep -q '^uses-permission:' qa-permissions-release.txt
          ! grep -q 'androidx.compose.ui.tooling.PreviewActivity' qa-manifest-xmltree-release.txt
          ! grep -q 'androidx.activity.ComponentActivity' qa-manifest-xmltree-release.txt
          ! grep -q 'androidx.profileinstaller.ProfileInstallReceiver' qa-manifest-xmltree-release.txt

          MERGED_MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests|packaged_manifests)/release/' | head -n1 || true)"
          test -n "$MERGED_MANIFEST"
          cp "$MERGED_MANIFEST" qa-merged-release-AndroidManifest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("qa-merged-release-AndroidManifest.xml").getroot()
          A="{http://schemas.android.com/apk/res/android}"
          assert not root.findall("uses-permission"), [x.attrib for x in root.findall("uses-permission")]
          tts_actions=[x.get(A+"name") for x in root.findall("./queries/intent/action")]
          assert "android.intent.action.TTS_SERVICE" in tts_actions, tts_actions
          app=root.find("application")
          assert app is not None
          assert app.get(A+"allowBackup")=="false"
          assert app.get(A+"usesCleartextTraffic")=="false"
          exported=[]
          for tag in ("activity","activity-alias","service","receiver","provider"):
              for x in app.findall(tag):
                  if x.get(A+"exported")=="true":
                      exported.append((tag,x.get(A+"name")))
          assert exported==[("activity","edu.gascnagercoil.environmentalsciences.MainActivity")], exported
          PY

          if grep -Eq ':drawable/fig_[0-9]+_u[0-9]+_ta([[:space:]]|$)' qa-resources-release.txt; then
            echo "Stale Tamil raster teaching plate resource remains in release APK" >&2
            exit 5
          fi
          grep -q ':raw/androidsvg_apache_2_license' qa-resources-release.txt
          grep -q ':raw/noto_sans_tamil_ofl' qa-resources-release.txt

          if zipinfo -1 "$RELEASE_APK" | grep -Ei "^assets/.*[.](html|js|css)$"; then
            echo "Unexpected web payload in release package" >&2
            exit 3
          fi

          rm -rf /tmp/v245-dex
          mkdir -p /tmp/v245-dex
          while read -r DEX; do
            unzip -p "$RELEASE_APK" "$DEX" > "/tmp/v245-dex/$(basename "$DEX")"
          done < <(zipinfo -1 "$RELEASE_APK" | grep -E '^classes([0-9]+)?[.]dex$')
          strings /tmp/v245-dex/*.dex > qa-dex-strings-release.txt
          ! grep -E 'android/webkit/WebView|Landroid/webkit/WebView;|okhttp3/|retrofit2/|com/google/firebase/analytics|com/google/android/gms/analytics' qa-dex-strings-release.txt
          ! grep -R -n -E 'android[.]webkit[.]WebView|WebView[(]|HttpURLConnection|java[.]net[.]URL|okhttp|retrofit|firebase[.]analytics|google[.]analytics' app/src/main/java

          BOOK_SHA=$(sha256sum app/src/main/res/raw/book_content.json | awk '{print $1}')
          {
            echo "architecture=pure_native_android"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "release_application_id=edu.gascnagercoil.environmentalsciences"
            echo "version_name=2.4.5"
            echo "version_code=20405"
            echo "book_nativeVersion=2.4.5"
            echo "book_schemaVersion=2"
            echo "book_content_sha256=$BOOK_SHA"
            echo "allowBackup=false"
            echo "usesCleartextTraffic=false"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "release_debuggable=false"
            echo "release_permissions=0"
            echo "release_exported_components=MainActivity_only"
            echo "release_webview_dex_scan=absent"
            echo "release_analytics_dex_scan=absent"
            echo "APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          } | tee qa-evidence-v245.txt

      - name: Prepare v2.4.5 QA artefact
        if: env.RELEASEQA_MODE == 'full'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifact
          mkdir -p qa-artifact
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_QA_APK="$(find app/build/outputs/apk/releaseQa -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$DEBUG_APK" qa-artifact/Environmental-Studies-v2.4.5-DEVICE-QA.apk
          cp "$RELEASE_APK" qa-artifact/Environmental-Studies-v2.4.5-UNSIGNED-R8-QA.apk
          cp "$RELEASE_QA_APK" qa-artifact/Environmental-Studies-v2.4.5-releaseQa-QA-ONLY-DEBUG-SIGNED.apk
          cp qa-badging-debug.txt qa-permissions-debug.txt qa-badging-release.txt qa-permissions-release.txt qa-resources-debug.txt qa-resources-release.txt qa-manifest-xmltree-release.txt qa-merged-release-AndroidManifest.xml qa-dex-strings-release.txt qa-evidence-v245.txt qa-artifact/
          cp v245-size-dex-report.txt release-signing-status.txt baseline-profile-status.txt androidsvg-emulator-status.txt v245-signing-qa-gate.txt release-privacy-dex-status.txt release-privacy-dex-urls.txt releaseqa-runtime-keep-match-summary.txt releaseqa-genuine-missing-runtime-classes.txt qa-artifact/
          if [ -f release-certificate.txt ]; then cp release-certificate.txt qa-artifact/; fi
          cp V240_STATIC_FINDINGS.json V240_SVG_RENAME_MAP.json V240_RELEASE_IDENTITY_AUDIT.json qa-artifact/
          cp V240_B_ARCHITECTURE_FINDINGS.json V240_C1_IMAGE_DECODE_AUDIT.json V240_C2_SVG_LEGIBILITY_AUDIT.json V240_C3_TAMIL_FONT_AUDIT.json V240_C4_ACCESSIBILITY_AUDIT.json qa-artifact/
          cp V241_DEVICE_FIGURE_QA_AUDIT.json V242_TAMIL_VISUAL_ICON_AUDIT.json V243_LIVING_ENVIRONMENT_AUDIT.json V243_VISUAL_ATLAS_COMPLETION_AUDIT.json V244_RELEASE_READINESS_AUDIT.json qa-artifact/
          cp V245_RELEASE_CANDIDATE_AUDIT.json V245_OPTION_DIFF.json V245_QUIZ_VALIDATION.json V245_PARITY_AUDIT.json qa-artifact/
          cp V245_INTERMEDIATE_STRUCTURE_AUDIT.json qa-artifact/
          cp V245_UI_POLISH_AUDIT.json qa-artifact/
          cp V245_PORTRAIT_UI_AUDIT.json qa-artifact/
          cp V245_LESSON_FIGURE_UI_AUDIT.json qa-artifact/
          cp V245_ITEM2_ORPHAN_FIGURES.json qa-artifact/
          cp V245_ITEM3_TAMIL_PARITY_AUDIT.json qa-artifact/
          cp V245_ITEM4_QUIZ_PUNCTUATION_AUDIT.json qa-artifact/
          cp V245_ITEM5_FIGURE_ROBUSTNESS_AUDIT.json qa-artifact/
          cp V245_ITEM6_PDF_EXPORT_AUDIT.json qa-artifact/
          cp V245_TTS_VISIBILITY_AUDIT.json qa-artifact/
          cp V245_FIG038_GLYPH_FIX_AUDIT.json qa-artifact/
          cp V245_RELEASE_RESOURCE_KEEP_AUDIT.json qa-artifact/
          cp V245_RELEASE_RESOURCE_INTEGRITY.json qa-artifact/
          cp V245_FIG038_RELEASE_VERIFY.json qa-artifact/
          cp fig038-native-release.png qa-artifact/
          cp V245_TOPIC_PARITY_AUDIT.json qa-artifact/
          cp ../../ci/parity-allowlist.json qa-artifact/
          cp -R qa-pdf-export qa-artifact/pdf-export-qa
          cp pdf-export-status.txt pdf-export-instrumentation.txt tts-instrumentation.txt tts-smoke-status.txt qa-artifact/
