          assert 'தொடர்க · கடைசியாக வாசித்த பாடம்' in app
          assert 'UnitSceneHero(unit.number)' in app

          sim=Path("app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/SimulationScreen.kt").read_text()
          assert 'EnvironmentalProcessExplorer(language)' in sim

          ui=Path("app/src/main/java/edu/gascnagercoil/environmentalsciences/ui")
          for name in ["AnimationNarration.kt","UnitScenes.kt","EnvironmentalAnimations.kt","ClimateEvents.kt"]:
              assert (ui/name).is_file(), name

          pre=json.loads(Path("/tmp/v225_pre_v230.json").read_text())
          post={}
          for q in Path(".").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  post[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          changed=sorted(p for p in set(pre)|set(post) if pre.get(p)!=post.get(p))
          Path("V230_CHANGED_FILE_INVENTORY.txt").write_text("\n".join(changed)+"\n")
          expected={
              "V230_LEARNING_EXPERIENCE_AUDIT.json",
              "V230_LEARNING_EXPERIENCE_CHANGELOG.md",
              "app/build.gradle.kts",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/App.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/SimulationScreen.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/AnimationNarration.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/UnitScenes.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/EnvironmentalAnimations.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt",
          }
          print("V230_CHANGED_FILES",len(changed))
          print("\n".join(changed))
          assert set(changed)==expected, (set(changed)-expected, expected-set(changed))
          PY

