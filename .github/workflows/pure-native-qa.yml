        run: |
          set -euo pipefail
          cat ci/v223finalparts/part* | base64 -d | gzip -dc > /tmp/apply_v223_tamil_coherence.py
          echo "fc7b432866c21f8961b0cd154bcc1cc2453434eff219518bdf0ffb96d7998b67  /tmp/apply_v223_tamil_coherence.py" | sha256sum -c -
