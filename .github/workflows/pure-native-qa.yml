      - name: Validate v2.4.5 SVG, quiz and EN-TA parity
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          EN_FONT="$(fc-match -f '%{file}' 'Noto Sans' | head -n1)"
          python ../../ci/audit_v245_svg_layout.py app/src/main/res/raw \
            --ta-font app/src/main/res/font/noto_sans_tamil.ttf \
            --en-font "$EN_FONT" \
            --out V245_SVG_LAYOUT_AFTER.json
          python - <<'PY'
          import json, re, hashlib
          from pathlib import Path
          from collections import Counter
          from PIL import ImageFont
          from jsonschema import validate

          before=json.load(open("V245_SVG_LAYOUT_BEFORE.json"))
          after=json.load(open("V245_SVG_LAYOUT_AFTER.json"))
          assert after["overflowCount"]==0, [
              (r["file"],r["overflow"]) for r in after["results"] if r.get("overflow")
          ]
          assert not any(re.search(r'\brx\s*:',p.read_text()) or re.search(r'\bry\s*:',p.read_text())
                         for p in Path("app/src/main/res/raw").glob("*.svg"))
          l22=next(x for x in after["results"] if x["file"]=="sci_u02_l22_trophic_ta.svg")
          assert not l22["overflow"]

          data=json.load(open("app/src/main/res/raw/book_content.json"))
          schema=json.load(open("../../ci/v245_quiz_schema.json"))
          validate(instance=data,schema=schema)
          assert data["schemaVersion"]==2 and data["nativeVersion"]=="2.4.5"
          quizzes=[q for u in data["units"] for q in u["quiz"]]
          assert len(quizzes)==58
          assert all(q.get("explanationEn","").strip() for q in quizzes)
          assert all(q.get("explanationTa","").strip() for q in quizzes)
          positions=Counter(q["answer"] for q in quizzes)
          assert positions==Counter({0:13,1:16,2:16,3:13})

          old=json.load(open("/tmp/book-content-v244.json"))
          oldq=[q for u in old["units"] for q in u["quiz"]]
          font=ImageFont.truetype("app/src/main/res/font/noto_sans_tamil.ttf",24)
          def strict_longest(q):
              widths=[font.getlength(o["en"]) for o in q["options"]]
              a=q["answer"]
              return widths[a] > max(w for i,w in enumerate(widths) if i!=a) + 0.25
          old_long=sum(strict_longest(q) for q in oldq)
          new_long=sum(strict_longest(q) for q in quizzes)
          assert old_long==22, old_long
          assert new_long<=17, new_long

          def counts(lang,kind):
              return sum(1 for u in data["units"] for l in u["lessons"]
                         for b in l[lang] if b.get("kind")==kind)
          en_tables=counts("english","table"); ta_tables=counts("tamil","table")
          assert en_tables==ta_tables==18

          def real_figs(lang):
              out=[]
              for u in data["units"]:
                  for l in u["lessons"]:
                      for b in l[lang]:
                          if b.get("kind") in ("figure","svg_figure") and b.get("figure"):
                              out.append((l["id"],b["figure"]))
              return out
          ef=real_figs("english"); tf=real_figs("tamil")
          assert len(ef)==len(tf)==46, (len(ef),len(tf))

          def list_counts(lang):
              c=Counter()
              for u in data["units"]:
                  for l in u["lessons"]:
                      c[l["id"]]+=sum(len(b.get("items",[])) for b in l[lang])
              return c
          lc_en=list_counts("english"); lc_ta=list_counts("tamil")
          list_gaps={k:(lc_en[k],lc_ta[k]) for k in sorted(set(lc_en)|set(lc_ta)) if lc_en[k]!=lc_ta[k]}

          privacy=data["privacy"]
          assert len(privacy["english"])==len(privacy["tamil"])==4
          assert privacy["version"]=="1.1 · 1 October 2026"
          assert privacy["credit"]==["Department of Zoology, GASC, Nagercoil / Created by R. Ramesh"]

          quiz_audit={
              "questions":len(quizzes),
              "longestCorrectBaselineRenderedWidth":old_long,
              "longestCorrectAfterRenderedWidth":new_long,
              "longestCorrectPercent":round(100*new_long/len(quizzes),2),
              "answerPositions":dict(sorted(positions.items())),
              "unitCounts":[len(u["quiz"]) for u in data["units"]],
              "unit8ExactDuplicateStems":len(data["units"][7]["quiz"])-len({q["questionEn"] for q in data["units"][7]["quiz"]}),
              "unit8Restructured":False,
              "schemaValidation":"PASS",
          }
          Path("V245_QUIZ_VALIDATION.json").write_text(json.dumps(quiz_audit,indent=2)+"\n")
          intermediate_structure={
              "tables":{"english":en_tables,"tamil":ta_tables,"gaps":0},
              "figuresAtThisIntermediateStage":{"english":len(ef),"tamil":len(tf)},
              "listItemCountGapsAtThisIntermediateStage":list_gaps,
              "privacyParagraphs":{"english":4,"tamil":4},
              "creditLine":privacy["credit"][0],
              "note":"This is an intermediate pre-item-1/pre-item-2 structure check, not the final EN-TA figure parity audit.",
          }
          Path("V245_INTERMEDIATE_STRUCTURE_AUDIT.json").write_text(
              json.dumps(intermediate_structure,ensure_ascii=False,indent=2)+"\n"
          )
          print("V245_SVG_OVERFLOW_BEFORE",before["overflowCount"])
          print("V245_SVG_OVERFLOW_AFTER",after["overflowCount"])
          print("V245_LONGEST_CORRECT",new_long,"/",len(quizzes),quiz_audit["longestCorrectPercent"])
          print("V245_LIST_ITEM_COUNT_GAPS",len(list_gaps))
          print("V245_BOOK_SHA256",hashlib.sha256(Path("app/src/main/res/raw/book_content.json").read_bytes()).hexdigest())
          PY

      - name: Apply explicit unsigned release QA signing gate
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path("app/build.gradle.kts")
          s=p.read_text()

          property_line='val allowUnsignedReleaseQa = providers.gradleProperty("ALLOW_UNSIGNED_RELEASE_QA").map { it.toBoolean() }.orElse(false)'
          guard_old='if (!hasReleaseSigning) throw GradleException("Original Environmental Studies release signing credentials are required; do not generate a replacement key.")'
          guard_new='if (!hasReleaseSigning && !allowUnsignedReleaseQa.get()) throw GradleException("Original Environmental Studies release signing credentials are required; do not generate a replacement key.")'

          assert property_line not in s, "unsigned QA property already present unexpectedly"
          assert s.count(guard_old)==1, "production signing guard not found exactly once"

          lines=s.splitlines()
          hits=[i for i,line in enumerate(lines) if line.startswith("val hasReleaseSigning =")]
          assert len(hits)==1, hits
          lines.insert(hits[0]+1, property_line)
          s="\n".join(lines)+"\n"
          s=s.replace(guard_old,guard_new,1)
          p.write_text(s)

          verify=p.read_text()
          assert verify.count(property_line)==1
          assert verify.count(guard_new)==1
          assert guard_old not in verify

          Path("v245-signing-qa-gate.txt").write_text(
              "production_signing_guard=RETAINED\n"
              "unsigned_release_qa_requires_explicit_property=true\n"
              "unsigned_release_qa_property=ALLOW_UNSIGNED_RELEASE_QA\n"
              "replacement_keystore_generation=PROHIBITED\n"
          )
          PY

      - name: Verify stable public Privacy Policy URL
        id: privacy_policy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          case "$PRIVACY_URL" in https://*) ;; *) echo "Privacy URL must use HTTPS" >&2; exit 2 ;; esac
          case "$PRIVACY_URL" in
            *raw.githubusercontent.com*|*/release/*|*/refs/heads/*|*/blob/*|*/tree/*)
              echo "Privacy URL is branch-specific or raw and is not stable enough for release." >&2
              exit 3
              ;;
          esac
          BODY="$(mktemp)"
          HTTP_CODE="$(curl -LsS --retry 3 -o "$BODY" -w '%{http_code}' "$PRIVACY_URL")"
          TITLE_MATCH=false
          VERSION_MATCH=false
          if grep -q '<strong>Environmental Studies</strong>' "$BODY"; then TITLE_MATCH=true; fi
          if grep -q 'Policy version: 1.1 · 1 October 2026' "$BODY"; then VERSION_MATCH=true; fi
          {
            echo "privacy_url=$PRIVACY_URL"
            echo "http_status=$HTTP_CODE"
            echo "contains_environmental_studies=$TITLE_MATCH"
            echo "contains_policy_version_1_1_1_october_2026=$VERSION_MATCH"
          } | tee "$GITHUB_WORKSPACE/privacy-url-status.txt"
          test "$HTTP_CODE" = "200"
          test "$TITLE_MATCH" = "true"
          test "$VERSION_MATCH" = "true"

