      - name: Apply and audit v2.2.5 lesson navigation UX
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ../../ci/apply_v225_navigation.py

