      - name: Prepare AndroidSVG emulator QA script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v245-androidsvg-emulator.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/native-build/Environmental-Studies-v2.0.0-native"

          # Build and install the app/test APKs explicitly instead of using
          # connectedDebugAndroidTest. AGP uninstalls the target app after a
          # connected test run, which made the subsequent run-as extraction
          # fail even though the instrumentation test itself passed.
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest \
            -PPRIVACY_POLICY_URL="$PRIVACY_URL" \
            --stacktrace

          PACKAGE=edu.gascnagercoil.environmentalsciences.debug
          APP_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$APP_APK"
          test -f "$TEST_APK"
          adb install -r "$APP_APK"
          adb install -r -t "$TEST_APK"

          INSTRUMENTATION="$(adb shell pm list instrumentation | tr -d '\r' | grep "(target=$PACKAGE)" | sed -n 's/^instrumentation:\([^ ]*\) .*/\1/p' | head -n1)"
          test -n "$INSTRUMENTATION"
          TEST_PACKAGE="${INSTRUMENTATION%%/*}"
          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.SvgAndroidSvgScreenshotTest \
            "$INSTRUMENTATION" | tee androidsvg-instrumentation.txt
          grep -Eq '^OK \([0-9]+ test' androidsvg-instrumentation.txt

          TEST_PACKAGE="${INSTRUMENTATION%%/*}"

          adb shell am instrument -w \
            -e class edu.gascnagercoil.environmentalsciences.qa.PdfExporterRenderTest \
            "$INSTRUMENTATION" | tee pdf-export-instrumentation.txt
          grep -Eq '^OK \([0-9]+ test' pdf-export-instrumentation.txt

          rm -rf qa-pdf-export
          mkdir -p qa-pdf-export
          PDF_PACKAGE=""
          for CANDIDATE in "$PACKAGE" "$TEST_PACKAGE"; do
            [ -n "$CANDIDATE" ] || continue
            if adb shell run-as "$CANDIDATE" test -d files/pdf-qa; then
              PDF_PACKAGE="$CANDIDATE"
              break
            fi
          done
          test -n "$PDF_PACKAGE"
          for NAME in english-figure.pdf tamil-svg.pdf; do
            adb exec-out run-as "$PDF_PACKAGE" cat "files/pdf-qa/$NAME" > "qa-pdf-export/$NAME"
            test -s "qa-pdf-export/$NAME"
          done
          pdffonts qa-pdf-export/tamil-svg.pdf | tee qa-pdf-export/tamil-fonts.txt
          grep -Eqi 'Noto.*Tamil' qa-pdf-export/tamil-fonts.txt
          pdfinfo qa-pdf-export/english-figure.pdf | tee qa-pdf-export/english-pdfinfo.txt
          pdfinfo qa-pdf-export/tamil-svg.pdf | tee qa-pdf-export/tamil-pdfinfo.txt
          echo "pdf_export_english_figure=PASS" | tee pdf-export-status.txt
          echo "pdf_export_tamil_svg=PASS" | tee -a pdf-export-status.txt
          echo "pdf_export_tamil_font=Noto Sans Tamil" | tee -a pdf-export-status.txt

          rm -rf qa-svg-androidsvg
          mkdir -p qa-svg-androidsvg

          # The screenshot harness can write via either targetContext or the
          # instrumentation context. Detect the actual owner instead of
          # assuming the target package owns files/svg-androidsvg.
          echo "androidsvg_target_package=$PACKAGE"
          echo "androidsvg_test_package=$TEST_PACKAGE"

          RENDER_PACKAGE=""
          for CANDIDATE in "$PACKAGE" "$TEST_PACKAGE"; do
            [ -n "$CANDIDATE" ] || continue
            echo "Checking AndroidSVG render output in $CANDIDATE"

            # Avoid nested device-shell quoting. Test the private directory
            # directly and enumerate its entries through run-as.
            if adb shell run-as "$CANDIDATE" test -d files/svg-androidsvg; then
              FILE_LIST="$(adb shell run-as "$CANDIDATE" ls files/svg-androidsvg | tr -d '\r')"
              COUNT="$(printf '%s\n' "$FILE_LIST" | grep -Ec '[.]png$' || true)"
              echo "androidsvg_candidate_png_count=$COUNT package=$CANDIDATE"
              if [ "${COUNT:-0}" -gt 0 ]; then
                RENDER_PACKAGE="$CANDIDATE"
                break
              fi
            fi
          done

          if [ -z "$RENDER_PACKAGE" ]; then
            echo "AndroidSVG render directory was not found in either app-private package." >&2
            adb shell pm list packages | tr -d '\r' | grep 'environmentalsciences' || true
            for CANDIDATE in "$PACKAGE" "$TEST_PACKAGE"; do
              [ -n "$CANDIDATE" ] || continue
              echo "Private-file diagnostic for $CANDIDATE" >&2
              adb shell run-as "$CANDIDATE" find files -maxdepth 3 -type f 2>/dev/null | head -100 || true
            done
            exit 11
          fi

          echo "androidsvg_render_package=$RENDER_PACKAGE" | tee androidsvg-render-package.txt
          REMOTE_FILES="$(adb shell run-as "$RENDER_PACKAGE" ls files/svg-androidsvg | tr -d '\r' | grep -E '[.]png$' | sort)"
          test -n "$REMOTE_FILES"
          while IFS= read -r NAME; do
            [ -n "$NAME" ] || continue
            REMOTE="files/svg-androidsvg/$NAME"
            adb exec-out run-as "$RENDER_PACKAGE" cat "$REMOTE" > "qa-svg-androidsvg/$NAME"
            test -s "qa-svg-androidsvg/$NAME"
          done <<< "$REMOTE_FILES"

          python - <<'PYPNG'
          from pathlib import Path
          files=sorted(Path("qa-svg-androidsvg").glob("*.png"))
          assert files, "No AndroidSVG PNG renders were extracted"
          sig=b"\x89PNG\r\n\x1a\n"
          bad=[p.name for p in files if not p.read_bytes().startswith(sig)]
          assert not bad, bad
          PYPNG

          EXPECTED="$(find app/src/main/res/raw -maxdepth 1 -type f -name '*_ta.svg' | wc -l)"
          ACTUAL="$(find qa-svg-androidsvg -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$ACTUAL" -eq "$EXPECTED"

          echo "androidsvg_tamil_svg_expected=$EXPECTED" | tee androidsvg-emulator-status.txt
          echo "androidsvg_tamil_svg_rendered=$ACTUAL" | tee -a androidsvg-emulator-status.txt
          echo "androidsvg_emulator_render=PASS" | tee -a androidsvg-emulator-status.txt

          if [ -n "${ENVSTUDIES_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ENVSTUDIES_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ENVSTUDIES_KEY_ALIAS:-}" ] && \
             [ -n "${ENVSTUDIES_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/environmental-studies-release.keystore"
            printf '%s' "$ENVSTUDIES_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            ENVSTUDIES_KEYSTORE_PATH="$KEYSTORE" gradle --no-daemon :app:generateBaselineProfile \
              -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
            echo "baseline_profile_device_generation=PASS" >> baseline-profile-status.txt
          else
            echo "baseline_profile_device_generation=SKIPPED_NO_PRODUCTION_SIGNING_SECRETS" >> baseline-profile-status.txt
          fi
          BASH
          chmod 700 "$RUNNER_TEMP/v245-androidsvg-emulator.sh"

      - name: Render every Tamil SVG through AndroidSVG on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/v245-androidsvg-emulator.sh"

      - name: Upload AndroidSVG Tamil render evidence
        uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-Tamil-SVG-Renders
          path: |
            native-build/Environmental-Studies-v2.0.0-native/qa-svg-androidsvg/
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-emulator-status.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-render-package.txt
            native-build/Environmental-Studies-v2.0.0-native/androidsvg-instrumentation.txt
          if-no-files-found: error

      - name: Inspect v2.4.5 package identity and offline contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$DEBUG_APK" | tee qa-badging-debug.txt
          "$AAPT" dump permissions "$DEBUG_APK" | tee qa-permissions-debug.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee qa-badging-release.txt
          "$AAPT" dump permissions "$RELEASE_APK" | tee qa-permissions-release.txt
          "$AAPT" dump resources "$DEBUG_APK" | tee qa-resources-debug.txt
          "$AAPT" dump resources "$RELEASE_APK" | tee qa-resources-release.txt
          "$AAPT" dump xmltree "$RELEASE_APK" AndroidManifest.xml | tee qa-manifest-xmltree-release.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging-debug.txt
          grep -q "versionCode='20405'" qa-badging-debug.txt
          grep -q "versionName='2.4.5-debug'" qa-badging-debug.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences'" qa-badging-release.txt
          grep -q "versionCode='20405'" qa-badging-release.txt
          grep -q "versionName='2.4.5'" qa-badging-release.txt
          ! grep -q 'application-debuggable' qa-badging-release.txt

          ! grep -q 'android.permission.INTERNET' qa-permissions-release.txt
          ! grep -q '^uses-permission:' qa-permissions-release.txt
          ! grep -q 'androidx.compose.ui.tooling.PreviewActivity' qa-manifest-xmltree-release.txt
          ! grep -q 'androidx.activity.ComponentActivity' qa-manifest-xmltree-release.txt
          ! grep -q 'androidx.profileinstaller.ProfileInstallReceiver' qa-manifest-xmltree-release.txt

          MERGED_MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests|packaged_manifests)/release/' | head -n1 || true)"
          test -n "$MERGED_MANIFEST"
          cp "$MERGED_MANIFEST" qa-merged-release-AndroidManifest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("qa-merged-release-AndroidManifest.xml").getroot()
          A="{http://schemas.android.com/apk/res/android}"
          assert not root.findall("uses-permission"), [x.attrib for x in root.findall("uses-permission")]
          app=root.find("application")
          assert app is not None
          assert app.get(A+"allowBackup")=="false"
          assert app.get(A+"usesCleartextTraffic")=="false"
          exported=[]
          for tag in ("activity","activity-alias","service","receiver","provider"):
              for x in app.findall(tag):
                  if x.get(A+"exported")=="true":
                      exported.append((tag,x.get(A+"name")))
          assert exported==[("activity","edu.gascnagercoil.environmentalsciences.MainActivity")], exported
          PY

          if grep -Eq ':drawable/fig_[0-9]+_u[0-9]+_ta([[:space:]]|$)' qa-resources-release.txt; then
            echo "Stale Tamil raster teaching plate resource remains in release APK" >&2
            exit 5
          fi
          grep -q ':raw/androidsvg_apache_2_license' qa-resources-release.txt
          grep -q ':raw/noto_sans_tamil_ofl' qa-resources-release.txt

          if zipinfo -1 "$RELEASE_APK" | grep -Ei "^assets/.*[.](html|js|css)$"; then
            echo "Unexpected web payload in release package" >&2
            exit 3
          fi

          rm -rf /tmp/v245-dex
          mkdir -p /tmp/v245-dex
          while read -r DEX; do
            unzip -p "$RELEASE_APK" "$DEX" > "/tmp/v245-dex/$(basename "$DEX")"
          done < <(zipinfo -1 "$RELEASE_APK" | grep -E '^classes([0-9]+)?[.]dex$')
          strings /tmp/v245-dex/*.dex > qa-dex-strings-release.txt
          ! grep -E 'android/webkit/WebView|Landroid/webkit/WebView;|okhttp3/|retrofit2/|com/google/firebase/analytics|com/google/android/gms/analytics' qa-dex-strings-release.txt
          ! grep -R -n -E 'android[.]webkit[.]WebView|WebView[(]|HttpURLConnection|java[.]net[.]URL|okhttp|retrofit|firebase[.]analytics|google[.]analytics' app/src/main/java

          BOOK_SHA=$(sha256sum app/src/main/res/raw/book_content.json | awk '{print $1}')
          {
            echo "architecture=pure_native_android"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "release_application_id=edu.gascnagercoil.environmentalsciences"
            echo "version_name=2.4.5"
            echo "version_code=20405"
            echo "book_nativeVersion=2.4.5"
            echo "book_schemaVersion=2"
            echo "book_content_sha256=$BOOK_SHA"
            echo "allowBackup=false"
            echo "usesCleartextTraffic=false"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "release_debuggable=false"
            echo "release_permissions=0"
            echo "release_exported_components=MainActivity_only"
            echo "release_webview_dex_scan=absent"
            echo "release_analytics_dex_scan=absent"
            echo "APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          } | tee qa-evidence-v245.txt

      - name: Prepare v2.4.5 QA artefact
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifact
          mkdir -p qa-artifact
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$DEBUG_APK" qa-artifact/Environmental-Studies-v2.4.5-DEVICE-QA.apk
          cp "$RELEASE_APK" qa-artifact/Environmental-Studies-v2.4.5-UNSIGNED-R8-QA.apk
          cp qa-badging-debug.txt qa-permissions-debug.txt qa-badging-release.txt qa-permissions-release.txt qa-resources-debug.txt qa-resources-release.txt qa-manifest-xmltree-release.txt qa-merged-release-AndroidManifest.xml qa-dex-strings-release.txt qa-evidence-v245.txt qa-artifact/
          cp v245-size-dex-report.txt release-signing-status.txt baseline-profile-status.txt androidsvg-emulator-status.txt v245-signing-qa-gate.txt qa-artifact/
          if [ -f release-certificate.txt ]; then cp release-certificate.txt qa-artifact/; fi
          cp V240_STATIC_FINDINGS.json V240_SVG_RENAME_MAP.json V240_RELEASE_IDENTITY_AUDIT.json qa-artifact/
          cp V240_B_ARCHITECTURE_FINDINGS.json V240_C1_IMAGE_DECODE_AUDIT.json V240_C2_SVG_LEGIBILITY_AUDIT.json V240_C3_TAMIL_FONT_AUDIT.json V240_C4_ACCESSIBILITY_AUDIT.json qa-artifact/
          cp V241_DEVICE_FIGURE_QA_AUDIT.json V242_TAMIL_VISUAL_ICON_AUDIT.json V243_LIVING_ENVIRONMENT_AUDIT.json V243_VISUAL_ATLAS_COMPLETION_AUDIT.json V244_RELEASE_READINESS_AUDIT.json qa-artifact/
          cp V245_RELEASE_CANDIDATE_AUDIT.json V245_OPTION_DIFF.json V245_QUIZ_VALIDATION.json V245_PARITY_AUDIT.json qa-artifact/
          cp V245_UI_POLISH_AUDIT.json qa-artifact/
          cp V245_PORTRAIT_UI_AUDIT.json qa-artifact/
          cp V245_LESSON_FIGURE_UI_AUDIT.json qa-artifact/
          cp V245_ITEM2_ORPHAN_FIGURES.json qa-artifact/
          cp V245_ITEM3_TAMIL_PARITY_AUDIT.json qa-artifact/
          cp V245_ITEM4_QUIZ_PUNCTUATION_AUDIT.json qa-artifact/
          cp V245_ITEM5_FIGURE_ROBUSTNESS_AUDIT.json qa-artifact/
          cp V245_ITEM6_PDF_EXPORT_AUDIT.json qa-artifact/
          cp -R qa-pdf-export qa-artifact/pdf-export-qa
          cp pdf-export-status.txt pdf-export-instrumentation.txt qa-artifact/
          cp V245_SVG_LAYOUT_BEFORE.json V245_SVG_LAYOUT_AFTER.json V245_TRANSFORM_SHA256.txt qa-artifact/
          cp ../../FACTS_TO_VERIFY.md ../../V230_PROVENANCE.md ../../V230_LEARNING_EXPERIENCE_AUDIT.md qa-artifact/
          cp -R qa-svg-androidsvg qa-artifact/androidsvg-tamil-renders
          if [ -d app/build/compose_compiler ]; then
            cp -r app/build/compose_compiler qa-artifact/compose_compiler
          fi
          tar -czf qa-artifact/v245-reconstructed-source.tar.gz \
            app/src/main/java app/src/main/res app/src/androidTest app/build.gradle.kts app/proguard-rules.pro \
            baselineprofile settings.gradle.kts build.gradle.kts gradle.properties
          cp app/src/main/res/raw/book_content.json qa-artifact/book_content_v245_release_candidate.json

          UNSIGNED_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1 || true)"
          if [ -n "$UNSIGNED_AAB" ] && [ -f "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" qa-artifact/Environmental-Studies-v2.4.5-UNSIGNED-AAB-QA.aab
          fi

          if grep -q 'signed_release_available=true' release-signing-status.txt; then
            SIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
            AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
            cp "$SIGNED_APK" qa-artifact/Environmental-Studies-v2.4.5-RELEASE.apk
            cp "$AAB" qa-artifact/Environmental-Studies-v2.4.5-RELEASE.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.5-RELEASE-CANDIDATE-QA
          path: native-build/Environmental-Studies-v2.0.0-native/qa-artifact/
          if-no-files-found: error
