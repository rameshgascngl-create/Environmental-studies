      - name: Build signed release APK and AAB when original signing secrets are present
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          STATUS=release-signing-status.txt
          if [ -n "${ENVSTUDIES_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ENVSTUDIES_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_ALIAS:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/environmental-studies-release.keystore"
            printf '%s' "$ENVSTUDIES_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            ENVSTUDIES_KEYSTORE_PATH="$KEYSTORE" gradle --no-daemon :app:assembleRelease :app:bundleRelease -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
            SIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
            test -f "$SIGNED_APK"
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" | tee release-certificate.txt
            grep -q 'Signer #1 certificate SHA-256 digest:' release-certificate.txt
            echo "signed_release_available=true" | tee "$STATUS"
          else
            echo "signed_release_available=false" | tee "$STATUS"
            echo "SIGNED RELEASE BLOCKED: ORIGINAL SIGNING CREDENTIALS REQUIRED" | tee -a "$STATUS"
            echo "Original production signing secrets are not configured on this runner; no replacement key was generated." | tee -a "$STATUS"
          fi

