          assert 'EnvironmentalProcessExplorer(language)' in sim

          ui=Path("app/src/main/java/edu/gascnagercoil/environmentalsciences/ui")
          for name in ["AnimationNarration.kt","UnitScenes.kt","EnvironmentalAnimations.kt","ClimateEvents.kt"]:
              assert (ui/name).is_file(), name

          pre=json.loads(Path("/tmp/v225_pre_v230.json").read_text())
          post={}
          for q in Path(".").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  post[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          changed=sorted(p for p in set(pre)|set(post) if pre.get(p)!=post.get(p))
          Path("V230_CHANGED_FILE_INVENTORY.txt").write_text("\n".join(changed)+"\n")
          expected={
              "V230_LEARNING_EXPERIENCE_AUDIT.json",
              "V230_LEARNING_EXPERIENCE_CHANGELOG.md",
              "app/build.gradle.kts",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/App.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/SimulationScreen.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/AnimationNarration.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/UnitScenes.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/EnvironmentalAnimations.kt",
              "app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt",
          }
          print("V230_CHANGED_FILES",len(changed))
          print("\n".join(changed))
          assert set(changed)==expected, (set(changed)-expected, expected-set(changed))
          PY

      - name: Verify public Privacy Policy URL
        shell: bash
        run: |
          set -euo pipefail
          case "$PRIVACY_URL" in https://*) ;; *) exit 2 ;; esac
          curl -fLsS --retry 3 "$PRIVACY_URL" | grep -q 'Environmental Studies'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint test and build device-QA APK
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          gradle --no-daemon clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace

      - name: Inspect APK identity, content identity and offline contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee qa-badging.txt
          "$AAPT" dump permissions "$APK" | tee qa-permissions.txt
          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging.txt
          grep -q "versionCode='20300'" qa-badging.txt
          grep -q "versionName='2.3.0-debug'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt
          if zipinfo -1 "$APK" | grep -Ei '^assets/.*\.(html|js|css)$'; then
            echo "Unexpected web payload" >&2
            exit 3
          fi
          {
            echo "architecture=pure_native_android"
            echo "ui=jetpack_compose"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "application_id=edu.gascnagercoil.environmentalsciences.debug"
            echo "version_name=2.3.0-debug"
            echo "version_code=20300"
            echo "units=9"
            echo "lessons=46"
            echo "book_content_sha256=$V224_BOOK_SHA256"
            echo "english_payload_unchanged=true"
            echo "tamil_lessons_reviewed=46"
            echo "tamil_lesson_bodies_changed=19"
            echo "tamil_review_prompts_rewritten=46"
            echo "lesson_home_one_tap=true"
            echo "lesson_unit_contents_one_tap=true"
            echo "lesson_previous_next_persistent=true"
            echo "lesson_back_targets_current_unit=true"
            echo "print_pdf_secondary_actions=true"
            echo "last_read_per_unit=true"
            echo "continue_markers=true"
            echo "realistic_context_scenes=9"
            echo "new_environmental_animation_pages=6"
            echo "total_narrated_animation_topics=10"
            echo "android_tts_audio=true"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - name: Prepare v2.3.0 visual-audio device-QA artifact
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifact
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$APK" qa-artifact/Environmental-Studies-v2.3.0-VISUAL-AUDIO-DEVICE-QA.apk
          cp qa-badging.txt qa-permissions.txt qa-evidence.txt qa-artifact/
          cp V230_LEARNING_EXPERIENCE_AUDIT.json V230_LEARNING_EXPERIENCE_CHANGELOG.md V230_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp V225_NAVIGATION_UX_AUDIT.json V225_NAVIGATION_UX_CHANGELOG.md V225_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp app/src/main/res/raw/book_content.json qa-artifact/book_content_v224_FROZEN.json
          cp V224_TAMIL_NATURALISATION_AUDIT.json V224_TAMIL_NATURALISATION_CHANGELOG.md V224_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp V223_TAMIL_COHERENCE_AUDIT.json V223_TAMIL_COHERENCE_CHANGELOG.md V223_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp V222_TAMIL_COLLEGE_AUDIT.json V222_TAMIL_EDITORIAL_CHANGELOG.md V222_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp V221_STATIC_AUDIT.json V221_PARITY_REGISTER.md V221_SCI_VIS_REGISTER.md V221_EDITORIAL_CHANGELOG.md qa-artifact/
          cp ../../V230_PROVENANCE.md ../../V230_LEARNING_EXPERIENCE_AUDIT.md qa-artifact/
          cp ../../V225_PROVENANCE.md ../../V225_NAVIGATION_UX_AUDIT.md qa-artifact/
          cp ../../V224_PROVENANCE.md ../../V224_TAMIL_NATURALISATION_AUDIT.md ../../TAMIL_TERMINOLOGY_MASTER_V224.md qa-artifact/
          cp ../../V223_PROVENANCE.md ../../V223_TAMIL_COHERENCE_AUDIT.md qa-artifact/
          cp ../../V222_PROVENANCE.md ../../TAMIL_TERMINOLOGY_MASTER_V222.md ../../V222_TAMIL_COLLEGE_EDITORIAL_AUDIT.md qa-artifact/
          cp ../../V221_PROVENANCE.md ../../TAMIL_TERMINOLOGY_MASTER_V221.md qa-artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.3.0-VISUAL-AUDIO-DEVICE-QA
          path: native-build/Environmental-Studies-v2.0.0-native/qa-artifact/
          if-no-files-found: error
