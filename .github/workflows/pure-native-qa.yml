      - name: release-resource-integrity
        if: env.RELEASEQA_MODE == 'full'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
          test -f "$RELEASE_APK"
          test -f "$RELEASE_AAB"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          python -m py_compile ../../ci/verify_v245_release_resource_integrity.py
          python ../../ci/verify_v245_release_resource_integrity.py \
            --apk "$RELEASE_APK" \
            --aab "$RELEASE_AAB" \
            --aapt "$AAPT"

          python - "$RELEASE_APK" <<'PYFIGREL'
          import hashlib
          import json
          import sys
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          apk=Path(sys.argv[1])
          integrity=json.loads(Path("V245_RELEASE_RESOURCE_INTEGRITY.json").read_text())
          resource_path=integrity["apk"]["resolvedResourcePaths"]["fig_038_u04_en"]
          with zipfile.ZipFile(apk) as z:
              payload=z.read(resource_path)
          packaged_sha=hashlib.sha256(payload).hexdigest()
          source=Path("app/src/main/res/drawable-nodpi/fig_038_u04_en.png")
          source_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          expected_source="994d1b3900cc01e80f5a649b704bca77133c16eb49868a01ec60451b0e5f6094"
          assert source_sha==expected_source,(source_sha,expected_source)
          packaged=Image.open(BytesIO(payload)).convert("RGBA")
          original=Image.open(source).convert("RGBA")
          assert packaged.size==(1600,511),packaged.size
          assert original.size==packaged.size
          assert packaged.tobytes()==original.tobytes(), "AAPT changed fig_038 decoded pixels"
          Path("fig038-native-release.png").write_bytes(payload)
          report={
              "scope":"built unsigned R8 release APK native fig_038 verification",
              "resource":"fig_038_u04_en",
              "resolvedApkPath":resource_path,
              "packagedPngSha256":packaged_sha,
              "approvedSourcePngSha256":source_sha,
              "expectedApprovedSourceSha256":expected_source,
              "dimensions":[1600,511],
              "decodedPixelsMatchApprovedSource":True,
              "nativeReleaseAssetCheck":"PASS",
              "missingGlyphBoxSourceRepair":"PASS_BY_APPROVED_SOURCE_HASH_AND_PIXEL_EQUIVALENCE",
              "releaseQaLessonScreenCheck":"PENDING_LATER_WORKFLOW_STEP"
          }
          Path("V245_FIG038_RELEASE_VERIFY.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PYFIGREL

