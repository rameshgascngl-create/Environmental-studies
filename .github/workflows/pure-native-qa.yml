      - name: Enforce final release-candidate gates
        if: always() && env.RELEASEQA_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if [ "${{ steps.privacy_policy.outcome }}" != "success" ]; then
            echo "RELEASE-CANDIDATE ONLY: stable public Privacy Policy endpoint is not yet available."
            failed=1
          fi
          if [ "${{ steps.item3_content.outcome }}" != "success" ]; then
            echo "RELEASE-CANDIDATE ONLY: Item 3 Tamil content defects remain OPEN."
            failed=1
          fi
          if [ "${{ steps.topic_parity.outcome }}" != "success" ]; then
            echo "RELEASE-CANDIDATE ONLY: unresolved diagram-topic parity entries remain."
            failed=1
          fi
          if [ "${{ steps.tts_engine.outcome }}" != "success" ]; then
            echo "RELEASE-CANDIDATE ONLY: engine-present English+Tamil TTS verification has not passed."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "NOT FINAL"
            exit 9
          fi
