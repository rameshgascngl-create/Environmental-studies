          changed=sorted(p for p in set(pre)|set(post) if pre.get(p)!=post.get(p))
          Path("V223_CHANGED_FILE_INVENTORY.txt").write_text("\n".join(changed)+"\n")
          expected={
              "V223_TAMIL_COHERENCE_AUDIT.json",
