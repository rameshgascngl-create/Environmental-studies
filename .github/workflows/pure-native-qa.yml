      - name: Verify public Privacy Policy URL
        shell: bash
        run: |
          set -euo pipefail
          case "$PRIVACY_URL" in https://*) ;; *) exit 2 ;; esac
          curl -fLsS --retry 3 "$PRIVACY_URL" | grep -q 'Environmental Studies'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build v2.4.0 debug QA and exercise minified release pipeline
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail

          # Release compilation/minification does not require a replacement signing key.
          # packageRelease is used as an unsigned R8/resource-shrinking QA artefact when
          # the original production signing secret is not available to this runner.
          gradle --no-daemon clean :app:lintRelease :app:testReleaseUnitTest :app:packageRelease -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace

          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1 || true)"
          test -n "$RELEASE_APK"
          test -f "$RELEASE_APK"

          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK")
          RELEASE_DEX=$(zipinfo -1 "$RELEASE_APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)

          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          DEBUG_SIZE=$(stat -c%s "$DEBUG_APK")
          DEBUG_DEX=$(zipinfo -1 "$DEBUG_APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)

          {
            echo "v230_debug_apk_bytes_reference=unknown_in_this_run"
            echo "v230_debug_dex_reference=8"
            echo "v240_debug_apk_bytes=$DEBUG_SIZE"
            echo "v240_debug_dex_count=$DEBUG_DEX"
            echo "v240_minified_unsigned_release_apk_bytes=$RELEASE_SIZE"
            echo "v240_minified_unsigned_release_dex_count=$RELEASE_DEX"
          } | tee v240-size-dex-report.txt

      - name: Build signed release APK and AAB when original signing secrets are present
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          STATUS=release-signing-status.txt
          if [ -n "${ENVSTUDIES_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ENVSTUDIES_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_ALIAS:-}" ] &&
             [ -n "${ENVSTUDIES_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/environmental-studies-release.keystore"
            printf '%s' "$ENVSTUDIES_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            ENVSTUDIES_KEYSTORE_PATH="$KEYSTORE" gradle --no-daemon :app:assembleRelease :app:bundleRelease -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
            echo "signed_release_available=true" | tee "$STATUS"
          else
            echo "signed_release_available=false" | tee "$STATUS"
            echo "Original production signing secrets are not configured on this runner; no replacement key was generated." | tee -a "$STATUS"
          fi

      - name: Inspect v2.4.0 package identity and offline contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$DEBUG_APK" | tee qa-badging-debug.txt
          "$AAPT" dump permissions "$DEBUG_APK" | tee qa-permissions-debug.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee qa-badging-release.txt
          "$AAPT" dump permissions "$RELEASE_APK" | tee qa-permissions-release.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging-debug.txt
          grep -q "versionCode='20400'" qa-badging-debug.txt
          grep -q "versionName='2.4.0-debug'" qa-badging-debug.txt

          grep -q "package: name='edu.gascnagercoil.environmentalsciences'" qa-badging-release.txt
          grep -q "versionCode='20400'" qa-badging-release.txt
          grep -q "versionName='2.4.0'" qa-badging-release.txt

          ! grep -q 'android.permission.INTERNET' qa-permissions-debug.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions-release.txt

          if zipinfo -1 "$RELEASE_APK" | grep -Ei '^assets/.*\.(html|js|css)$'; then
            echo "Unexpected web payload in release package" >&2
            exit 3
          fi

          BOOK_SHA=$(sha256sum app/src/main/res/raw/book_content.json | awk '{print $1}')
          {
            echo "architecture=pure_native_android"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "release_application_id=edu.gascnagercoil.environmentalsciences"
            echo "version_name=2.4.0"
            echo "version_code=20400"
            echo "book_nativeVersion=2.4.0"
            echo "book_schemaVersion=1"
            echo "book_content_sha256=$BOOK_SHA"
            echo "allowBackup=false"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "release_debuggable=false"
            echo "version_prefixed_svg_assets=0"
            echo "APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          } | tee qa-evidence-v240-a.txt

      - name: Prepare Task A QA artefact
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-artifact
          mkdir -p qa-artifact
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$DEBUG_APK" qa-artifact/Environmental-Studies-v2.4.0-TASK-A-DEVICE-QA.apk
          cp "$RELEASE_APK" qa-artifact/Environmental-Studies-v2.4.0-UNSIGNED-R8-QA.apk
          cp qa-badging-debug.txt qa-permissions-debug.txt qa-badging-release.txt qa-permissions-release.txt qa-evidence-v240-a.txt qa-artifact/
          cp v240-size-dex-report.txt release-signing-status.txt qa-artifact/
          cp V240_STATIC_FINDINGS.json V240_SVG_RENAME_MAP.json V240_RELEASE_IDENTITY_AUDIT.json qa-artifact/
          cp V240_B_ARCHITECTURE_FINDINGS.json qa-artifact/
          cp V240_B1_ARCHITECTURE_REFACTOR.json V240_B_TASK_AUDIT.json qa-artifact/
          if [ -d app/build/compose_compiler ]; then
            cp -r app/build/compose_compiler qa-artifact/compose_compiler
          fi
          cp app/src/main/res/raw/book_content.json qa-artifact/book_content_v240_task_a.json
          cp ../../V230_PROVENANCE.md ../../V230_LEARNING_EXPERIENCE_AUDIT.md qa-artifact/

          # Preserve the reconstructed Kotlin/Gradle/manifest sources as Task B audit evidence.
          # This does not modify application behaviour; it lets the architecture refactor be
          # designed against the exact source that passed Task A.
          mkdir -p qa-artifact/task-b-source
          cp -R app/src/main/java qa-artifact/task-b-source/java
          cp app/build.gradle.kts qa-artifact/task-b-source/app-build.gradle.kts
          cp app/src/main/AndroidManifest.xml qa-artifact/task-b-source/AndroidManifest.xml

          if grep -q 'signed_release_available=true' release-signing-status.txt; then
            SIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
            AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
            cp "$SIGNED_APK" qa-artifact/Environmental-Studies-v2.4.0-RELEASE.apk
            cp "$AAB" qa-artifact/Environmental-Studies-v2.4.0-RELEASE.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.4.0-TASK-A-QA
          path: native-build/Environmental-Studies-v2.0.0-native/qa-artifact/
          if-no-files-found: error
