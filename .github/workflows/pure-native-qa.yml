          assert audit["book_content_sha256"]=="1f3b63f25719a7b495528770db4853f01461ebbd4b2b75136235d31ce6ddd211"
          book=Path("app/src/main/res/raw/book_content.json")
          assert hashlib.sha256(book.read_bytes()).hexdigest()=="1f3b63f25719a7b495528770db4853f01461ebbd4b2b75136235d31ce6ddd211"
          gradle=Path("app/build.gradle.kts").read_text()
          assert 'versionCode = 20203' in gradle
          assert 'versionName = "2.2.3"' in gradle

