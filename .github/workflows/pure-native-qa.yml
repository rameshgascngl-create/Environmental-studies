      - name: ReleaseQa test-vs-app DEX namespace audit
        if: env.RELEASEQA_MODE != 'full'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          echo "releaseqa_mode=$RELEASEQA_MODE"

          gradle --no-daemon :app:assembleReleaseQa :app:assembleReleaseQaAndroidTest \
            -PPRIVACY_POLICY_URL="$PRIVACY_URL" \
            --stacktrace

          APP_APK="$(find app/build/outputs/apk/releaseQa -maxdepth 1 -type f -name '*.apk' | head -n1)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/releaseQa -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$APP_APK"
          test -f "$TEST_APK"

          rm -rf releaseqa-app-dex releaseqa-test-dex
          mkdir -p releaseqa-app-dex releaseqa-test-dex
          unzip -q "$APP_APK" 'classes*.dex' -d releaseqa-app-dex
          unzip -q "$TEST_APK" 'classes*.dex' -d releaseqa-test-dex
          test -n "$(find releaseqa-app-dex -name 'classes*.dex' -print -quit)"
          test -n "$(find releaseqa-test-dex -name 'classes*.dex' -print -quit)"

          find releaseqa-app-dex -name 'classes*.dex' -type f -print0 \
            | xargs -0 strings \
            | grep -aoE 'L(kotlin|kotlinx|androidx/test)/[A-Za-z0-9_$/.-]+;' \
            | sort -u > releaseqa-app-namespace-descriptors.txt || true

          find releaseqa-test-dex -name 'classes*.dex' -type f -print0 \
            | xargs -0 strings \
            | grep -aoE 'L(kotlin|kotlinx|androidx/test)/[A-Za-z0-9_$/.-]+;' \
            | sort -u > releaseqa-test-namespace-descriptors.txt || true

          comm -23 releaseqa-test-namespace-descriptors.txt releaseqa-app-namespace-descriptors.txt \
            > releaseqa-missing-runtime-descriptors.txt

          python - <<'PYDEX'
          import struct
          from pathlib import Path

          namespaces=("kotlin.", "kotlinx.", "androidx.test.")

          def u32(data, offset):
              return struct.unpack_from("<I", data, offset)[0]

          def read_uleb128(data, offset):
              value=0
              shift=0
              pos=offset
              while True:
                  b=data[pos]
                  pos += 1
                  value |= (b & 0x7f) << shift
                  if b & 0x80 == 0:
                      return value, pos
                  shift += 7
                  if shift > 35:
                      raise ValueError("ULEB128 too large")

          def dex_types_and_defs(path):
              data=path.read_bytes()
              assert data.startswith(b"dex\n"), path
              string_ids_size=u32(data, 0x38)
              string_ids_off=u32(data, 0x3c)
              type_ids_size=u32(data, 0x40)
              type_ids_off=u32(data, 0x44)
              class_defs_size=u32(data, 0x60)
              class_defs_off=u32(data, 0x64)

              def dex_string(index):
                  assert 0 <= index < string_ids_size
                  off=u32(data, string_ids_off + index * 4)
                  _, pos=read_uleb128(data, off)
                  end=data.index(0, pos)
                  return data[pos:end].decode("ascii")

              types=[
                  dex_string(u32(data, type_ids_off + i * 4))
                  for i in range(type_ids_size)
              ]
              defs={
                  types[u32(data, class_defs_off + i * 32)]
                  for i in range(class_defs_size)
              }
              return set(types), defs

          def normalise_classes(descriptors):
              out=set()
              for desc in descriptors:
                  while desc.startswith("["):
                      desc=desc[1:]
                  if not (desc.startswith("L") and desc.endswith(";")):
                      continue
                  cls=desc[1:-1].replace("/", ".")
                  if cls.startswith(namespaces):
                      out.add(cls)
              return out

          def collect(directory):
              refs=set()
              defs=set()
              dex_files=sorted(Path(directory).glob("classes*.dex"))
              assert dex_files, f"No DEX files in {directory}"
              for path in dex_files:
                  types, class_defs=dex_types_and_defs(path)
                  refs |= normalise_classes(types)
                  defs |= normalise_classes(class_defs)
              return refs, defs

          app_refs, app_defs=collect("releaseqa-app-dex")
          test_refs, test_defs=collect("releaseqa-test-dex")
          genuine_missing=sorted(test_refs - test_defs - app_defs)

          legacy_src=Path("releaseqa-missing-runtime-descriptors.txt")
          legacy_classes=[]
          for line in legacy_src.read_text().splitlines():
              s=line.strip()
              if not s:
                  continue
              assert s.startswith("L") and s.endswith(";"), s
              legacy_classes.append(s[1:-1].replace("/", "."))

          Path("releaseqa-missing-runtime-classes.txt").write_text(
              "\n".join(legacy_classes) + ("\n" if legacy_classes else ""), encoding="utf-8"
          )
          Path("releaseqa-missing-runtime-keep-rules.pro").write_text(
              "".join(f"-keep class {c} {{ *; }}\n" for c in legacy_classes), encoding="utf-8"
          )
          Path("releaseqa-genuine-missing-runtime-classes.txt").write_text(
              "\n".join(genuine_missing) + ("\n" if genuine_missing else ""), encoding="utf-8"
          )

          baseline=Path("../../ci/v245_releaseqa_runtime_keep.pro").read_text(encoding="utf-8")
          keep_rules=[]
          for line in baseline.splitlines():
              line=line.strip()
              if not line.startswith("-keep class "):
                  continue
              cls=line[len("-keep class "):].split(None, 1)[0]
              keep_rules.append(cls)
          assert len(keep_rules) == len(set(keep_rules)), "Duplicate exact keep rules found"
          keep_rule_set=set(keep_rules)
          preexisting_lazy={
              "kotlin.LazyKt",
              "kotlin.LazyKt__LazyJVMKt",
              "kotlin.LazyKt__LazyKt",
          }
          assert preexisting_lazy <= keep_rule_set
          run199_keep_rules=keep_rule_set - preexisting_lazy
          assert len(run199_keep_rules) == 1365, len(run199_keep_rules)

          matched=sorted(keep_rule_set & app_defs)
          unmatched=sorted(keep_rule_set - app_defs)
          run199_matched=sorted(run199_keep_rules & app_defs)
          run199_unmatched=sorted(run199_keep_rules - app_defs)
          Path("releaseqa-keep-rules-matching-app-defs.txt").write_text(
              "\n".join(matched) + ("\n" if matched else ""), encoding="utf-8"
          )
          Path("releaseqa-keep-rules-unmatched-app-defs.txt").write_text(
              "\n".join(unmatched) + ("\n" if unmatched else ""), encoding="utf-8"
          )
          Path("releaseqa-run199-keep-rules-matching-app-defs.txt").write_text(
              "\n".join(run199_matched) + ("\n" if run199_matched else ""), encoding="utf-8"
          )
          Path("releaseqa-run199-keep-rules-unmatched-app-defs.txt").write_text(
              "\n".join(run199_unmatched) + ("\n" if run199_unmatched else ""), encoding="utf-8"
          )

          counts={
              "test_namespace_descriptors": sum(1 for _ in Path("releaseqa-test-namespace-descriptors.txt").open()),
              "app_namespace_descriptors": sum(1 for _ in Path("releaseqa-app-namespace-descriptors.txt").open()),
              "legacy_descriptor_difference": len(legacy_classes),
              "test_referenced_namespace_classes": len(test_refs),
              "test_defined_namespace_classes": len(test_defs),
              "app_defined_namespace_classes": len(app_defs),
              "genuine_missing_runtime_classes": len(genuine_missing),
              "keep_rules_total": len(keep_rules),
              "preexisting_lazy_keep_rules": len(preexisting_lazy),
              "run199_keep_rules_total": len(run199_keep_rules),
              "run199_keep_rules_matching_app_defined_classes": len(run199_matched),
              "run199_keep_rules_matching_nothing_in_app_dex": len(run199_unmatched),
              "keep_rules_matching_app_defined_classes": len(matched),
              "keep_rules_matching_nothing_in_app_dex": len(unmatched),
          }
          summary="\n".join(f"{k}={v}" for k,v in counts.items())+"\n"
          Path("releaseqa-dex-audit-summary.txt").write_text(summary, encoding="utf-8")
          Path("releaseqa-runtime-keep-match-summary.txt").write_text(
              "\n".join([
                  f"keep_rules_total={len(keep_rules)}",
                  f"preexisting_lazy_keep_rules={len(preexisting_lazy)}",
                  f"run199_keep_rules_total={len(run199_keep_rules)}",
                  f"run199_keep_rules_matching_app_defined_classes={len(run199_matched)}",
                  f"run199_keep_rules_matching_nothing_in_app_dex={len(run199_unmatched)}",
                  f"keep_rules_matching_app_defined_classes={len(matched)}",
                  f"keep_rules_matching_nothing_in_app_dex={len(unmatched)}",
              ])+"\n",
              encoding="utf-8",
          )
          print(summary, end="")
          print("GENUINE_MISSING_RUNTIME_CLASS_LIST_BEGIN")
          print(Path("releaseqa-genuine-missing-runtime-classes.txt").read_text(), end="")
          print("GENUINE_MISSING_RUNTIME_CLASS_LIST_END")
          PYDEX

          sha256sum "$APP_APK" "$TEST_APK" | tee releaseqa-apk-sha256.txt
          sha256sum releaseqa-app-dex/classes*.dex | sort | tee releaseqa-app-dex-sha256.txt
          sha256sum releaseqa-test-dex/classes*.dex | sort | tee releaseqa-test-dex-sha256.txt

      - name: Prove releaseQa target/test rules are isolated from production release
        if: env.RELEASEQA_MODE != 'dex_audit'
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          QA_TEST_RULE="app/proguard-releaseqa-androidtest.pro"
          QA_TARGET_RULE="app/proguard-releaseqa-target.pro"
          APP_GRADLE="app/build.gradle.kts"
          test -f "$QA_TEST_RULE"
          test -f "$QA_TARGET_RULE"
          test -f "$APP_GRADLE"
          cp "$APP_GRADLE" "$RUNNER_TEMP/app-build-after.gradle.kts"

          # Recreate the immediately preceding failing state: the AndroidTest
          # stdlib dependency and AndroidTest keep rules remain, but the new
          # releaseQa-target keep file is detached. Production release is never edited.
          python - <<'PYQA'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          line='            proguardFiles("proguard-releaseqa-target.pro")\n'
          assert s.count(line) == 1, "releaseQa target keep rule attachment missing"
          p.write_text(s.replace(line, "", 1))
          PYQA

          export ENVSTUDIES_KEYSTORE_PATH=""
          export ENVSTUDIES_KEYSTORE_PASSWORD=""
          export ENVSTUDIES_KEY_ALIAS=""
          export ENVSTUDIES_KEY_PASSWORD=""

          build_release_snapshot() {
            label="$1"
            gradle --no-daemon clean :app:packageRelease \
              -PPRIVACY_POLICY_URL="$PRIVACY_URL" \
              -PALLOW_UNSIGNED_RELEASE_QA=true \
              --stacktrace
            apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
            test -f "$apk"
            dex_dir="$RUNNER_TEMP/production-$label-dex"
            rm -rf "$dex_dir"
            mkdir -p "$dex_dir"
            unzip -q "$apk" 'classes*.dex' -d "$dex_dir"
            (cd "$dex_dir" && sha256sum classes*.dex | sort) > "$RUNNER_TEMP/production-$label-dex.sha256"
            test -f app/build/outputs/mapping/release/configuration.txt
            cp app/build/outputs/mapping/release/configuration.txt "$RUNNER_TEMP/production-$label-r8-configuration.txt"
            sha256sum "$RUNNER_TEMP/production-$label-r8-configuration.txt" > "$RUNNER_TEMP/production-$label-r8-configuration.sha256"
          }

          build_release_snapshot before
          cp "$RUNNER_TEMP/app-build-after.gradle.kts" "$APP_GRADLE"
          grep -Fq 'proguardFiles("proguard-releaseqa-target.pro")' "$APP_GRADLE"
          grep -Fq -- '-keep class kotlin.LazyKt { *; }' "$QA_TARGET_RULE"
          grep -Fq -- '-keep class kotlin.LazyKt__LazyJVMKt { *; }' "$QA_TARGET_RULE"
          grep -Fq -- '-keep class kotlin.LazyKt__LazyKt { *; }' "$QA_TARGET_RULE"
          build_release_snapshot after

          strings "$RUNNER_TEMP"/production-after-dex/classes*.dex \
            | grep -E '^https://rameshgascngl-create[.]github[.]io/.*privacy-policy[.]html$' \
            | sort -u > release-privacy-dex-urls.txt || true
          test -s release-privacy-dex-urls.txt
          test "$(wc -l < release-privacy-dex-urls.txt)" -eq 1
          BUILT_PRIVACY_URL="$(cat release-privacy-dex-urls.txt)"
          {
            echo "built_release_dex_privacy_url=$BUILT_PRIVACY_URL"
            echo "ci_privacy_url=$PRIVACY_URL"
          } | tee release-privacy-dex-status.txt
          test "$BUILT_PRIVACY_URL" = "$PRIVACY_URL"
          OLD_PRIVACY_URL="https://rameshgascngl-create.github.io/Environmental-studies/privacy-policy.html"
          ! grep -Fxq "$OLD_PRIVACY_URL" release-privacy-dex-urls.txt
          echo "built_release_privacy_url_match=PASS" | tee -a release-privacy-dex-status.txt

          cmp "$RUNNER_TEMP/production-before-dex.sha256" "$RUNNER_TEMP/production-after-dex.sha256"
          cmp "$RUNNER_TEMP/production-before-r8-configuration.txt" "$RUNNER_TEMP/production-after-r8-configuration.txt"
          {
            echo "production_release_dex_identity=PASS"
            echo "production_release_r8_configuration_identity=PASS"
            echo "production_release_keep_rule_set_identity=PASS"
            echo "qa_target_rule_scope=releaseQa-target-only"
            echo "qa_test_rule_scope=releaseQa-AndroidTest-only"
            echo "qa_test_dependency_scope=androidTestImplementation-only"
            echo "releaseqa_exact_runtime_keep_sha256=$(sha256sum ../../ci/v245_releaseqa_runtime_keep.pro | awk '{print $1}')"
            echo "before_dex_sha256:"
            cat "$RUNNER_TEMP/production-before-dex.sha256"
            echo "after_dex_sha256:"
            cat "$RUNNER_TEMP/production-after-dex.sha256"
            echo "before_r8_configuration_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/production-before-r8-configuration.sha256")"
            echo "after_r8_configuration_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/production-after-r8-configuration.sha256")"
          } | tee v245-production-isolation-proof.txt

