name: Environmental Studies v2.2.1 Final Correction QA

on:
  push:
    branches:
      - correction/v2.2.1-tamil-editorial-scivis-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_ZIP: Environmental-Studies-v2.0.0-native-source-ENHANCED.zip
      SOURCE_SHA256: db7d221b1ab2522b36120d39dba7b2d22155e7f98992b672c5035469d6e02c54
      PRIVACY_URL: https://raw.githubusercontent.com/rameshgascngl-create/Environmental-studies/correction/v2.2.1-tamil-editorial-scivis-20260929/site/privacy-policy.html
      V22_BOOK_SHA256: 7c8ab000ab12e69c43b1ae7723264b0d9d3f5c9506b037a4a06480230e7ebbbd
      V221_INITIAL_SHA256: 766910513a31c5ea9ccb9514237f8664c31076c92d3fd79bb1005643133da599
      V222_EDITORIAL_SHA256: 7781bd031ef43fdab16e44c024e87584f79550da5e86d0a88b7f0913f510dd4e
      V223_COHERENCE_SHA256: 1f3b63f25719a7b495528770db4853f01461ebbd4b2b75136235d31ce6ddd211
      V221_FINAL_SHA256: 3b6d24d0a60ea7f8931e99035f80340dd8e9092725a402c4229f15045cff09ce

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify correction branch scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=993c43272229f4da9a77237dee7b2dc55f272869
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"..HEAD | tee correction-branch-files.txt
          python - <<'PY'
          import subprocess
          allowed={
            "V221_PROVENANCE.md",
            "TAMIL_TERMINOLOGY_MASTER_V221.md",
            "ci/apply_v221_corrections.py",
            "ci/apply_v221_final_harmonization.py",
            ".github/workflows/pure-native-qa.yml",
          }
          files=subprocess.check_output(
              ["git","diff","--name-only","993c43272229f4da9a77237dee7b2dc55f272869..HEAD"],
              text=True
          ).splitlines()
          unexpected=[x for x in files if x not in allowed]
          assert not unexpected, unexpected
          PY

      - name: Verify native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -

      - name: Reconstruct validated v2.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-build
          mkdir native-build
          unzip -q "$SOURCE_ZIP" -d native-build
          cd native-build/Environmental-Studies-v2.0.0-native
          patch -p1 < ../../ci/indus-hold.patch
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt
          python ../../ci/apply_v21.py
          cp ../../site/privacy-policy.html site/privacy-policy.html

      - name: Verify frozen Android contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_source_gate.py .
          ! grep -R -n -E 'android\.webkit\.WebView|WebView\(' app/src/main/java
          ! find app/src/main -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print -quit | grep -q .
          grep -q 'edu.gascnagercoil.environmentalsciences' app/build.gradle.kts

      - name: Reconstruct exact audited v2.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          cp overlay/v2.1/app/build.gradle.kts native-build/Environmental-Studies-v2.0.0-native/app/build.gradle.kts
          cat ci/v22lineparts/part* > /tmp/apply_v22_visuals.py
          echo "ad8058babfd17c1ee3579503a388d907491ac316258aec2a66f0e62155e20e95  /tmp/apply_v22_visuals.py" | sha256sum -c -
          python -m py_compile /tmp/apply_v22_visuals.py
          cd native-build/Environmental-Studies-v2.0.0-native
          python /tmp/apply_v22_visuals.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('versionCode = 20100','versionCode = 20200')
          s=s.replace('versionName = "2.1.0"','versionName = "2.2.0"')
          if 'com.caverock:androidsvg-aar:1.4' not in s:
              s=s.replace(
                  'implementation("androidx.compose.ui:ui-tooling-preview")',
                  'implementation("androidx.compose.ui:ui-tooling-preview")\n    implementation("com.caverock:androidsvg-aar:1.4")'
              )
          p.write_text(s)
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("V22_AUDITED_BOOK_SHA256",digest)
          assert digest=="7c8ab000ab12e69c43b1ae7723264b0d9d3f5c9506b037a4a06480230e7ebbbd",digest
          data=json.loads(book.read_text())
          assert len(data["units"])==9
          assert sum(len(u["lessons"]) for u in data["units"])==46
          snap={}
          for q in Path("app").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  snap[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          Path("/tmp/v22_app_pre.json").write_text(json.dumps(snap,sort_keys=True))
          PY

      - name: Apply original v2.2.1 correction layer
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python ../../ci/apply_v221_corrections.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("V221_INITIAL_BOOK_SHA256",digest)
          assert digest=="766910513a31c5ea9ccb9514237f8664c31076c92d3fd79bb1005643133da599",digest
          audit=json.loads(Path("V221_STATIC_AUDIT.json").read_text())
          assert audit["lessons"]==46
          assert audit["learning_outcome_blocks"]==0
          assert audit["generic_tamil_heading_blocks"]==0
          PY

      - name: Assemble pinned 46-lesson Tamil college editorial pass
        shell: bash
        run: |
          set -euo pipefail
          PIN=bca389b6ff7e8ea64a0fabb0b95e5830f933e8a0
          git cat-file -e "$PIN^{commit}"
          : > /tmp/apply_v222_tamil_college_edit.py
          for i in 00 01 02 03 04 05 06 07; do
            git show "$PIN:ci/v222lineparts/part$i" >> /tmp/apply_v222_tamil_college_edit.py
          done
          python -m py_compile /tmp/apply_v222_tamil_college_edit.py

      - name: Apply pinned Tamil college editorial pass
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_v222_tamil_college_edit.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("COLLEGE_EDITORIAL_BOOK_SHA256",digest)
          assert digest=="7781bd031ef43fdab16e44c024e87584f79550da5e86d0a88b7f0913f510dd4e",digest
          audit=json.loads(Path("V222_TAMIL_COLLEGE_AUDIT.json").read_text())
          assert audit["lessons"]==46
          assert audit["english_payload_unchanged"] is True
          assert audit["figure_routing_unchanged"] is True
          PY

      - name: Assemble pinned line-by-line Tamil coherence pass
        shell: bash
        run: |
          set -euo pipefail
          PIN=e66ae72ec765f7e8318108dcfdd5cdfbe71728a1
          git cat-file -e "$PIN^{commit}"
          : > /tmp/v223_payload.b64
          for i in 00 01 02 03 04 05 06 07; do
            git show "$PIN:ci/v223finalparts/part$i" >> /tmp/v223_payload.b64
          done
          base64 -d /tmp/v223_payload.b64 | gzip -dc > /tmp/apply_v223_tamil_coherence.py
          echo "fc7b432866c21f8961b0cd154bcc1cc2453434eff219518bdf0ffb96d7998b67  /tmp/apply_v223_tamil_coherence.py" | sha256sum -c -
          python -m py_compile /tmp/apply_v223_tamil_coherence.py

      - name: Apply line-by-line Tamil coherence pass
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_v223_tamil_coherence.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("LINE_BY_LINE_BOOK_SHA256",digest)
          assert digest=="1f3b63f25719a7b495528770db4853f01461ebbd4b2b75136235d31ce6ddd211",digest
          audit=json.loads(Path("V223_TAMIL_COHERENCE_AUDIT.json").read_text())
          assert len(audit["lessons_reviewed"])==46
          assert audit["english_payload_unchanged"] is True
          assert audit["figure_routing_unchanged"] is True
          PY

      - name: Apply final v2.2.1 terminology and whole-content harmonization
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python ../../ci/apply_v221_final_harmonization.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          audit=json.loads(Path("V221_FINAL_STATIC_AUDIT.json").read_text())
          assert audit["versionName"]=="2.2.1"
          assert audit["versionCode"]==20201
          assert audit["nativeVersion"]=="2.2.1"
          assert audit["units"]==9
          assert audit["lessons"]==46
          assert audit["lesson_pairing_complete"] is True
          assert audit["learning_outcome_blocks"]==0
          assert audit["generic_tamil_heading_blocks"]==0
          assert not audit["duplicate_heading_body_blocks"]
          assert not audit["empty_lessons"]
          assert all(v==0 for v in audit["deprecated_term_counts"].values()),audit["deprecated_term_counts"]
          assert not audit["missing_figure_refs"]
          assert not audit["svg_parse_errors"]
          assert not audit["external_svg_dependencies"]
          assert not audit["duplicate_resource_stems"]
          assert len(audit["figure_resource_parity_exceptions"])==1
          assert audit["figure_resource_parity_exceptions"][0][0]=="4.2"
          assert audit["book_content_sha256"]=="3b6d24d0a60ea7f8931e99035f80340dd8e9092725a402c4229f15045cff09ce"
          assert hashlib.sha256(Path("app/src/main/res/raw/book_content.json").read_bytes()).hexdigest()==audit["book_content_sha256"]
          gradle=Path("app/build.gradle.kts").read_text()
          assert 'versionCode = 20201' in gradle
          assert 'versionName = "2.2.1"' in gradle
          PY

      - name: Produce exact final app diff inventory
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          pre=json.loads(Path("/tmp/v22_app_pre.json").read_text())
          post={}
          for q in Path("app").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  post[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          changed=sorted(p for p in set(pre)|set(post) if pre.get(p)!=post.get(p))
          Path("V221_FINAL_CHANGED_FILE_INVENTORY.txt").write_text("\n".join(changed)+"\n")
          allowed_exact={
              "app/build.gradle.kts",
              "app/src/main/res/raw/book_content.json",
          }
          unexpected=[
              p for p in changed
              if p not in allowed_exact
              and not p.startswith("app/src/main/res/raw/v22_")
              and not p.startswith("app/src/main/res/raw/v221_u05_l51_")
          ]
          print("FINAL_CHANGED_APP_FILES",len(changed))
          print("\n".join(changed))
          assert not unexpected,unexpected
          PY

      - name: Verify public Privacy Policy URL
        shell: bash
        run: |
          set -euo pipefail
          case "$PRIVACY_URL" in https://*) ;; *) exit 2 ;; esac
          curl -fLsS --retry 3 "$PRIVACY_URL" | grep -q 'Environmental Studies'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint test and build device-QA APK
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          gradle --no-daemon clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace

      - name: Inspect APK identity and offline contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee qa-badging.txt
          "$AAPT" dump permissions "$APK" | tee qa-permissions.txt
          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging.txt
          grep -q "versionCode='20201'" qa-badging.txt
          grep -q "versionName='2.2.1-debug'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt
          if zipinfo -1 "$APK" | grep -Ei '^assets/.*\.(html|js|css)$'; then
            echo "Unexpected web payload" >&2
            exit 3
          fi
          {
            echo "architecture=pure_native_android"
            echo "ui=jetpack_compose"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "application_id=edu.gascnagercoil.environmentalsciences.debug"
            echo "version_name=2.2.1-debug"
            echo "version_code=20201"
            echo "units=9"
            echo "lessons=46"
            echo "learning_outcome_blocks=0"
            echo "generic_tamil_heading_blocks=0"
            echo "book_content_sha256=$V221_FINAL_SHA256"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - name: Prepare v2.2.1 final correction device-QA artifact
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifact
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$APK" qa-artifact/Environmental-Studies-v2.2.1-CORRECTION-DEVICE-QA.apk
          cp qa-badging.txt qa-permissions.txt qa-evidence.txt qa-artifact/
          cp V221_FINAL_STATIC_AUDIT.json V221_FINAL_PARITY_REGISTER.md V221_FINAL_SCI_VIS_REGISTER.md V221_FINAL_EDITORIAL_CHANGELOG.md V221_FINAL_CHANGED_FILE_INVENTORY.txt qa-artifact/
          cp V221_STATIC_AUDIT.json V221_PARITY_REGISTER.md V221_SCI_VIS_REGISTER.md V221_EDITORIAL_CHANGELOG.md qa-artifact/
          cp ../../V221_PROVENANCE.md ../../TAMIL_TERMINOLOGY_MASTER_V221.md qa-artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.2.1-FINAL-CORRECTION-DEVICE-QA
          path: native-build/Environmental-Studies-v2.0.0-native/qa-artifact/
          if-no-files-found: error
