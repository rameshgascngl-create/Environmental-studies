name: Environmental Studies v2.2 Academic Visuals QA
# Build gate: pure Android + Indus hold corrections

on:
  push:
    branches:
      - feature/v2.2-academic-visuals-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ZIP: Environmental-Studies-v2.0.0-native-source-ENHANCED.zip
      SOURCE_SHA256: db7d221b1ab2522b36120d39dba7b2d22155e7f98992b672c5035469d6e02c54
      PRIVACY_URL: https://raw.githubusercontent.com/rameshgascngl-create/Environmental-studies/feature/v2.2-academic-visuals-20260929/site/privacy-policy.html

    steps:
      - uses: actions/checkout@v4

      - name: Verify native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -

      - name: Expand source and apply Indus hold corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-build
          mkdir native-build
          unzip -q "$SOURCE_ZIP" -d native-build
          test -d native-build/Environmental-Studies-v2.0.0-native
          cd native-build/Environmental-Studies-v2.0.0-native
          patch -p1 < ../../ci/indus-hold.patch
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt
          python ../../ci/apply_v21.py
          cp ../../site/privacy-policy.html site/privacy-policy.html

      - name: Inspect lesson content model
        shell: bash
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          set -euo pipefail
          echo "=== BLOCK MODEL ==="
          grep -R -n -E 'data class .*Block|sealed (class|interface).*Block|class .*Block' app/src/main/java/edu/gascnagercoil/environmentalsciences | head -80 || true
          echo "=== LESSON SCREEN ==="
          grep -n -A90 -B15 'private fun LessonScreen' app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/App.kt || true
          echo "=== OBJECTIVE PHRASES ==="
          grep -R -n -E 'By the end of this lesson|Learning Objectives|கற்றல் நோக்க|பாடத்தின் முடிவில்' app/src/main | head -80 || true

      - name: Verify pure-native source contract
        shell: bash
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          set -euo pipefail
          python tools/check_source_gate.py .
          ! grep -R -n -E 'android\.webkit\.WebView|WebView\(' app/src/main/java
          ! find app/src/main -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print -quit | grep -q .
          grep -q 'edu.gascnagercoil.environmentalsciences' app/build.gradle.kts

      - name: Apply v2.1 build identity and v2.2 academic visuals
        shell: bash
        run: |
          set -euo pipefail
          cp overlay/v2.1/app/build.gradle.kts native-build/Environmental-Studies-v2.0.0-native/app/build.gradle.kts
          cat ci/v22lineparts/part* > ci/apply_v22_visuals.py
          python -m py_compile ci/apply_v22_visuals.py
          echo "V22_GENERATOR_SHA256=$(sha256sum ci/apply_v22_visuals.py | awk '{print $1}')"
          cd native-build/Environmental-Studies-v2.0.0-native
          python ../../ci/apply_v22_visuals.py
          python - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('versionCode = 20100','versionCode = 20200')
          s=s.replace('versionName = "2.1.0"','versionName = "2.2.0"')
          p.write_text(s)
          PY
          grep -q 'versionName = "2.2.0"' app/build.gradle.kts
          grep -q 'versionCode = 20200' app/build.gradle.kts
          test "$(find app/src/main/res/raw -type f -name 'v22_*.svg' | wc -l)" -eq 34
          test "$(find app/src/main/res/drawable-nodpi -type f -name '*.png' | wc -l)" -eq 63
          grep -q 'com.caverock:androidsvg-aar:1.4' app/build.gradle.kts
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("app/src/main/res/raw/book_content.json").read_text())
          blocks=[b for u in data["units"] for lesson in u["lessons"] for lang in ("english","tamil") for b in lesson[lang] if b.get("kind")=="svg_figure"]
          assert len(blocks)==34, len(blocks)
          assert all(b.get("figure","").startswith("v22_") for b in blocks)
          print("SVG_FIGURE_BLOCKS", len(blocks))
          PY

      - name: Verify public Privacy Policy URL
        shell: bash
        run: |
          set -euo pipefail
          case "$PRIVACY_URL" in
            https://*) ;;
            *) echo "Privacy URL must use HTTPS" >&2; exit 2 ;;
          esac
          curl -fLsS --retry 3 "$PRIVACY_URL" | grep -q 'Environmental Studies'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean, lint, test and assemble pure native APK
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          gradle --no-daemon clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug             -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace

      - name: Inspect APK identity and offline contract
        shell: bash
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee qa-badging.txt
          "$AAPT" dump permissions "$APK" | tee qa-permissions.txt
          grep -q "package: name='edu.gascnagercoil.environmentalsciences.debug'" qa-badging.txt
          grep -q "versionCode='20200'" qa-badging.txt
          grep -q "versionName='2.2.0-debug'" qa-badging.txt
          ! grep -q 'android.permission.INTERNET' qa-permissions.txt
          if zipinfo -1 "$APK" | grep -Ei '^assets/.*\.(html|js|css)$'; then
            echo "Unexpected web payload in APK" >&2
            exit 3
          fi
          {
            echo "architecture=pure_native_android"
            echo "ui=jetpack_compose"
            echo "webview=absent"
            echo "internet_permission=absent"
            echo "application_id=edu.gascnagercoil.environmentalsciences.debug"
            echo "version_name=2.2.0-debug"
            echo "version_code=20200"
            echo "privacy_policy=$PRIVACY_URL"
            echo "academic_visuals_svg_resources=34"
            echo "academic_visuals_svg_blocks=34"
            echo "existing_png_assets=63"
            echo "lesson_objectives=hidden_from_learning_flow"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          } | tee qa-evidence.txt

      - name: Prepare downloadable QA artifact
        shell: bash
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        run: |
          set -euo pipefail
          mkdir -p qa-artifact
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          cp "$APK" qa-artifact/Environmental-Studies-v2.2.0-ACADEMIC-VISUALS-DEVICE-QA.apk
          cp qa-badging.txt qa-permissions.txt qa-evidence.txt qa-artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Environmental-Studies-v2.2.0-ACADEMIC-VISUALS-DEVICE-QA
          path: native-build/Environmental-Studies-v2.0.0-native/qa-artifact/
          if-no-files-found: error
