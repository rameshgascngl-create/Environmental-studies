name: Environmental Studies v2.4.0 Audit Verification

on:
  push:
    branches:
      - hardening/v2.4.0-audit-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ZIP: Environmental-Studies-v2.0.0-native-source-ENHANCED.zip
      SOURCE_SHA256: db7d221b1ab2522b36120d39dba7b2d22155e7f98992b672c5035469d6e02c54
      PRIVACY_URL: https://raw.githubusercontent.com/rameshgascngl-create/Environmental-studies/hardening/v2.4.0-audit-20261001/site/privacy-policy.html
      V221_BOOK_SHA256: 766910513a31c5ea9ccb9514237f8664c31076c92d3fd79bb1005643133da599
      V222_BOOK_SHA256: 7781bd031ef43fdab16e44c024e87584f79550da5e86d0a88b7f0913f510dd4e
      V223_BOOK_SHA256: 1f3b63f25719a7b495528770db4853f01461ebbd4b2b75136235d31ce6ddd211
      V224_BOOK_SHA256: 1bf866f457cdb7c2590469b32d692f56b5000a58ff76eba1604b0ad158962f40
      ENVSTUDIES_KEYSTORE_BASE64: ${{ secrets.ENVSTUDIES_KEYSTORE_BASE64 }}
      ENVSTUDIES_KEYSTORE_PASSWORD: ${{ secrets.ENVSTUDIES_KEYSTORE_PASSWORD }}
      ENVSTUDIES_KEY_ALIAS: ${{ secrets.ENVSTUDIES_KEY_ALIAS }}
      ENVSTUDIES_KEY_PASSWORD: ${{ secrets.ENVSTUDIES_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Task A branch scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=e00284feefa6544081ee13d58eeee7e57121582c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"..HEAD | tee v240-task-a-branch-files.txt
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(
              ["git","diff","--name-only","e00284feefa6544081ee13d58eeee7e57121582c..HEAD"],
              text=True
          ).splitlines())
          expected={
              ".github/workflows/pure-native-qa.yml",
              "ci/audit_v240_findings.py",
              "ci/apply_v240_a1_release_hardening.py",
              "ci/verify_v240_a2_preview_tooling.py",
              "ci/apply_v240_a3_backup_policy.py",
              "ci/verify_v240_a4_r8_policy.py",
              "ci/apply_v240_a5_release_identity.py",
              "ci/audit_v240_b_architecture.py",
              "ci/apply_v240_b1_architecture.py",
              "ci/apply_v240_b2_state.py",
              "ci/apply_v240_b3_compose_stability.py",
              "overlay/v2.4/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/LearningStateViewModel.kt",
          }
          assert files==expected, (files-expected, expected-files)
          PY

      - name: Verify native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -

      - name: Reconstruct validated v2.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-build
          mkdir native-build
          unzip -q "$SOURCE_ZIP" -d native-build
          cd native-build/Environmental-Studies-v2.0.0-native
          patch -p1 < ../../ci/indus-hold.patch
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt
          python ../../ci/apply_v21.py
          cp ../../site/privacy-policy.html site/privacy-policy.html

      - name: Verify pure-native source contract
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_source_gate.py .
          ! grep -R -n -E 'android\.webkit\.WebView|WebView\(' app/src/main/java
          ! find app/src/main -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print -quit | grep -q .
          grep -q 'edu.gascnagercoil.environmentalsciences' app/build.gradle.kts

      - name: Reconstruct exact audited v2.2 content
        shell: bash
        run: |
          set -euo pipefail
          cp overlay/v2.1/app/build.gradle.kts native-build/Environmental-Studies-v2.0.0-native/app/build.gradle.kts
          cat ci/v22lineparts/part* > /tmp/apply_v22_visuals.py
          python -m py_compile /tmp/apply_v22_visuals.py
          cd native-build/Environmental-Studies-v2.0.0-native
          python /tmp/apply_v22_visuals.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('versionCode = 20100','versionCode = 20200')
          s=s.replace('versionName = "2.1.0"','versionName = "2.2.0"')
          if 'com.caverock:androidsvg-aar:1.4' not in s:
              s=s.replace('implementation("androidx.compose.ui:ui-tooling-preview")',
                          'implementation("androidx.compose.ui:ui-tooling-preview")\n    implementation("com.caverock:androidsvg-aar:1.4")')
          p.write_text(s)
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("V22_AUDITED_BOOK_SHA256",digest)
          assert digest=="7c8ab000ab12e69c43b1ae7723264b0d9d3f5c9506b037a4a06480230e7ebbbd",digest
          data=json.loads(book.read_text())
          assert len(data["units"])==9
          assert sum(len(u["lessons"]) for u in data["units"])==46
          PY

      - name: Reconstruct exact successful v2.2.1 correction baseline
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python ../../ci/apply_v221_corrections.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          book=Path("app/src/main/res/raw/book_content.json")
          digest=hashlib.sha256(book.read_bytes()).hexdigest()
          print("V221_RECONSTRUCTED_BOOK_SHA256",digest)
          assert digest=="766910513a31c5ea9ccb9514237f8664c31076c92d3fd79bb1005643133da599",digest
          audit=json.loads(Path("V221_STATIC_AUDIT.json").read_text())
          assert audit["versionName"]=="2.2.1"
          assert audit["versionCode"]==20201
          assert audit["units"]==9
          assert audit["lessons"]==46
          assert audit["learning_outcome_blocks"]==0
          assert audit["generic_tamil_heading_blocks"]==0
          assert not audit["empty_lessons"]
          assert not audit["missing_figure_refs"]
          assert not audit["svg_parse_errors"]
          p=Path("app/build.gradle.kts").read_text()
          assert 'versionCode = 20201' in p
          assert 'versionName = "2.2.1"' in p
          snap={}
          for q in Path(".").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  snap[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          Path("/tmp/v221_pre_v222.json").write_text(json.dumps(snap,sort_keys=True))
          PY

      - name: Assemble and verify v2.2.2 Tamil college editorial pass
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v222lineparts/part* > /tmp/apply_v222_tamil_college_edit.py
          sha256sum /tmp/apply_v222_tamil_college_edit.py | tee /tmp/v222-editorial-script.sha256
          python -m py_compile /tmp/apply_v222_tamil_college_edit.py

      - name: Apply and audit v2.2.2 Tamil college editorial pass
        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_v222_tamil_college_edit.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          audit=json.loads(Path("V222_TAMIL_COLLEGE_AUDIT.json").read_text())
          assert audit["versionName"]=="2.2.2"
          assert audit["versionCode"]==20202
          assert audit["units"]==9
          assert audit["lessons"]==46
          assert audit["english_payload_unchanged"] is True
          assert audit["figure_routing_unchanged"] is True
          assert audit["english_payload_sha256_before"]=="2f34a366bf6bd27f62f703284e335262c7fc1ed79e48221973532c5af93485a0"
          assert audit["english_payload_sha256_after"]=="2f34a366bf6bd27f62f703284e335262c7fc1ed79e48221973532c5af93485a0"
          assert audit["book_content_sha256"]=="7781bd031ef43fdab16e44c024e87584f79550da5e86d0a88b7f0913f510dd4e"
          assert all(v==0 for v in audit["forbidden_phrase_counts"].values()), audit["forbidden_phrase_counts"]
          expected_svgs=[
              "v221_u05_l51_ta.svg",
              "v22_u05_l52_ta.svg",
              "v22_u09_l93_ta.svg",
              "v22_u09_l94_ta.svg",
              "v22_u09_l95_ta.svg",
              "v22_u09_l96_ta.svg",
          ]
          assert audit["tamil_svg_files_changed"]==expected_svgs, audit["tamil_svg_files_changed"]
          assert len(audit["remaining_latin_script_entries"])==40, len(audit["remaining_latin_script_entries"])
          book=Path("app/src/main/res/raw/book_content.json")
          assert hashlib.sha256(book.read_bytes()).hexdigest()=="7781bd031ef43fdab16e44c024e87584f79550da5e86d0a88b7f0913f510dd4e"

          pre=json.loads(Path("/tmp/v221_pre_v222.json").read_text())
          post={}
          for q in Path(".").rglob("*"):
              if q.is_file() and "/build/" not in str(q):
                  post[str(q)]=hashlib.sha256(q.read_bytes()).hexdigest()
          changed=sorted(p for p in set(pre)|set(post) if pre.get(p)!=post.get(p))
          Path("V222_CHANGED_FILE_INVENTORY.txt").write_text("\n".join(changed)+"\n")
          expected={
              "V222_TAMIL_COLLEGE_AUDIT.json",
              "V222_TAMIL_EDITORIAL_CHANGELOG.md",
              "app/build.gradle.kts",
              "app/src/main/res/raw/book_content.json",
              "app/src/main/res/raw/v221_u05_l51_ta.svg",
              "app/src/main/res/raw/v22_u05_l52_ta.svg",
              "app/src/main/res/raw/v22_u09_l93_ta.svg",
              "app/src/main/res/raw/v22_u09_l94_ta.svg",
              "app/src/main/res/raw/v22_u09_l95_ta.svg",
              "app/src/main/res/raw/v22_u09_l96_ta.svg",
          }
          print("V222_CHANGED_FILES",len(changed))
          print("\n".join(changed))
          assert set(changed)==expected, (set(changed)-expected, expected-set(changed))
          PY

      - name: Assemble and verify v2.2.3 Tamil coherence pass
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v223finalparts/part* | base64 -d | gzip -dc > /tmp/apply_v223_tamil_coherence.py
          echo "fc7b432866c21f8961b0cd154bcc1cc2453434eff219518bdf0ffb96d7998b67  /tmp/apply_v223_tamil_coherence.py" | sha256sum -c -
