        working-directory: native-build/Environmental-Studies-v2.0.0-native
        shell: bash
        run: |
          set -euo pipefail

          # Release compilation/minification does not require a replacement signing key.
          # packageRelease is used as an unsigned R8/resource-shrinking QA artefact when
          # the original production signing secret is not available to this runner.
          ENVSTUDIES_KEYSTORE_PATH= ENVSTUDIES_KEYSTORE_PASSWORD= ENVSTUDIES_KEY_ALIAS= ENVSTUDIES_KEY_PASSWORD= \
            gradle --no-daemon clean :app:lintRelease :app:testReleaseUnitTest :app:packageRelease :app:bundleRelease \
            -PPRIVACY_POLICY_URL="$PRIVACY_URL" -PALLOW_UNSIGNED_RELEASE_QA=true --stacktrace

          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1 || true)"
          test -n "$RELEASE_APK"
          test -f "$RELEASE_APK"

          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK")
          RELEASE_DEX=$(zipinfo -1 "$RELEASE_APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)

          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug -PPRIVACY_POLICY_URL="$PRIVACY_URL" --stacktrace
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          DEBUG_SIZE=$(stat -c%s "$DEBUG_APK")
          DEBUG_DEX=$(zipinfo -1 "$DEBUG_APK" | grep -Ec '^classes([0-9]+)?\.dex$' || true)

          {
            echo "v244_debug_apk_bytes_reference=13824106"
            echo "v244_release_apk_bytes_reference=1763943"
            echo "v244_debug_dex_reference=8"
            echo "v244_release_dex_reference=1"
            echo "v245_debug_apk_bytes=$DEBUG_SIZE"
            echo "v245_debug_dex_count=$DEBUG_DEX"
