name: v2.2.1 Baseline Materialize

on:
  push:
    branches:
      - correction/v2.2.1-tamil-editorial-scivis-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-v22:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct audited v2.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-build
          mkdir native-build
          unzip -q Environmental-Studies-v2.0.0-native-source-ENHANCED.zip -d native-build
          cd native-build/Environmental-Studies-v2.0.0-native
          patch -p1 < ../../ci/indus-hold.patch
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/VisualLearning.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/ClimateEvents.kt
          cp ../../overlay/v2.1/app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/QuizScreen.kt
          python ../../ci/apply_v21.py
          cd ../..
          cat ci/v22lineparts/part* > ci/apply_v22_visuals.py
          python -m py_compile ci/apply_v22_visuals.py
          cd native-build/Environmental-Studies-v2.0.0-native
          python ../../ci/apply_v22_visuals.py
          ACTUAL="$(sha256sum app/src/main/res/raw/book_content.json | awk '{print $1}')"
          echo "book_content.json SHA256=$ACTUAL"
          test "$ACTUAL" = "7c8ab000ab12e69c43b1ae7723264b0d9d3f5c9506b037a4a06480230e7ebbbd"
          mkdir -p /tmp/v221-baseline
          cp app/src/main/res/raw/book_content.json /tmp/v221-baseline/
          cp app/src/main/res/raw/v22_*.svg /tmp/v221-baseline/
          cp app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/NativeContent.kt /tmp/v221-baseline/
          cp app/src/main/java/edu/gascnagercoil/environmentalsciences/ui/PdfExporter.kt /tmp/v221-baseline/
      - uses: actions/upload-artifact@v4
        with:
          name: v221-authoritative-v22-content
          path: /tmp/v221-baseline/
          if-no-files-found: error
